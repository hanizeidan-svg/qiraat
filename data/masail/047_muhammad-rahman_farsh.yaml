- id: 52-1048b
  bayt: [1048, 1049]
  qawl: "وَالْمُسَيْطِرُونَ لِساَنٌ عَابَ بِالْخُلْفِ زُمَّلاَ وَصَاد كَزَايٍ قَامَ بِالْخُلْفِ ضَبْعُهُ"
  rumuz: "ل (لسان) = هشام، ع (عاب) = حفص بالخلف، ز (زملا) = قنبل (والخلف لحفص وحده على الوافي)؛ ق (قام) = خلاد بالخلف، ض (ضبعه) = خلف"
  word: أَمْ هُمُ الْمُصَيْطِرُونَ
  scope: موضع واحد (الطور 37)
  loc: {at: [[52, 37, "المصيطرون"]]}
  readings:
    - {by: "هشام", tahwil: [["صَ", "سَ"]], wasf: "بالسين", dalil: "وَالْمُسَيْطِرُونَ لِساَنٌ", ramz: "ل (لسان) = هشام"}
    - {by: "قنبل", tahwil: [["صَ", "سَ"]], wasf: "بالسين", dalil: "وَالْمُسَيْطِرُونَ ... زُمَّلاَ", ramz: "ز (زملا) = قنبل"}
    - {by: "حفص", wasf: "بالصاد الخالصة", dalil: "وَالْمُسَيْطِرُونَ ... عَابَ بِالْخُلْفِ", ramz: "ع (عاب) = حفص بالخلف"}
    - {by: "حفص", tahwil: [["صَ", "سَ"]], wasf: "بالسين", dalil: "وَالْمُسَيْطِرُونَ ... عَابَ بِالْخُلْفِ", ramz: "ع (عاب) = حفص بالخلف"}
    - {by: "خلف", wasf: "بإشمام الصاد صوت الزاي", dalil: "وَصَاد كَزَايٍ قَامَ بِالْخُلْفِ ضَبْعُهُ", ramz: "ض (ضبعه) = خلف"}
    - {by: "خلاد", wasf: "بإشمام الصاد صوت الزاي", dalil: "وَصَاد كَزَايٍ قَامَ بِالْخُلْفِ", ramz: "ق (قام) = خلاد بالخلف"}
    - {by: "خلاد", wasf: "بالصاد الخالصة", dalil: "وَصَاد كَزَايٍ قَامَ بِالْخُلْفِ", ramz: "ق (قام) = خلاد بالخلف"}
    - {by: "الباقون", wasf: "بالصاد الخالصة", dalil: "مفهوم: الرسم بالصاد", ramz: "—"}
  note: "لحفص فيها الوجهان من طريق الشاطبية والصاد مقدَّم، ولذلك يظهر تنبيه أن وجه السين لا يطابق نص المصحف. «بِمُصَيْطِرٍ» (الغاشية 22) في فرشها. الوافي ص 363: «وقرأ هشام وقنبل وحفص بخلف عنه» بالسين، فالخلف لحفص وحده وقنبل بالسين بلا خلاف (فحُذف له وجه الصاد)؛ وخلاد بالإشمام بخلف عنه، والصاد الخالصة «الوجه الثاني لحفص وخلاد»، فالإشمام مقدَّم لخلاد على ترتيب الوافي."
  marji:
    - {kitab: "الوافي", safha: "363", mawdu: "الوافي ص 363: «وقرأ هشام وقنبل وحفص بخلف عنه» بالسين، فالخلف لحفص وحده وقنبل بالسين بلا خلاف (فحُذف له وجه الصاد)"}
  iqrar:
    - {man: "هاني زيدان", tarikh: "2026-10-04", mawdu: "الصاد أولًا لحفص في «المصيطرون»"}
  tahrir:
    - {naw: "تنبيه على العبارة", rawi: "قنبل، حفص", bayan: "ظاهر قوله «عاب بالخلف زملا» أن الخلف يشمل حفصًا وقنبلًا", hukm: "الخلف لحفص وحده (الصاد ثم السين)، وقنبل بالسين بلا خلاف", qawl: "وقرأ هشام وقنبل وحفص بخلف عنه", kitab: "الوافي", safha: "363"}

