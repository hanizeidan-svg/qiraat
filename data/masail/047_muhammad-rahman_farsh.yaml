- id: 47-1039a
  bayt: [1039]
  qawl: "وَفِي آنِفًا خُلْفٌ هَدى"
  rumuz: "ه (هدى) = البزي بالخلف؛ والمراد القصر المذكور في البيت قبله"
  word: مَاذَا قَالَ آنِفًا
  scope: موضع واحد
  loc: {at: [[47, 16, "آنفا"]]}
  readings:
    - {by: "الباقون", lafz: "آنِفًا", wasf: "بالمد", dalil: "وَفِي آنِفًا خُلْفٌ هَدى (والقصر للبزي ليس من طريق الشاطبية)", ramz: "ه (هدى) = البزي بالخلف"}
  note: "الوافي ص 361–362: مفاد النظم للبزي القصر والمد، لكن على قول أهل التحقيق القصر له «ليس من طريق الشاطبي»، فلا يُقرأ له إلا بالمد؛ فحُذف وجه القصر."
  marji:
    - {kitab: "الوافي", safha: "361–362", mawdu: "الوافي ص 361–362: مفاد النظم للبزي القصر والمد، لكن على قول أهل التحقيق القصر له «ليس من طريق الشاطبي»، فلا يُقرأ له إلا بالمد"}
    - {kitab: "الوافي", safha: "363", mawdu: "تتمة كلامه: القصر للبزي «ليس من طريق الشاطبي فلا يقرأ له من طريقه إلا بالمد»"}
  tahrir:
    - {naw: "خروج عن الطريق", rawi: "البزي", bayan: "ذكر الناظم للبزي خلفًا في قصر همزة «آنفا» (خلف هدى)", hukm: "لا يقرأ به؛ ليس للبزي إلا المد كالباقين", qawl: "ليس من طريق الشاطبي فلا يقرأ له من طريقه إلا بالمد", kitab: "الوافي", safha: "362–363"}

