# أصول سورة الحجر من «البدور الزاهرة» (الأبواب الستة، الرواة الأربعة عشر)
# المصدر: «البدور الزاهرة» (الممال والمدغم آخر كل ربع، والياءات في مواضعها)؛ الأبيات من الشاطبية.

# ───────────── الإمالة والتقليل ─────────────
- id: u15-m001
  bayt: [321, 322, 324]
  qawl: "وَفِي أَلِفَاتٍ قَبْلَ رَا طَرَفٍ أَتَتْ بِكَسْرٍ أَمِلْ تُدْعى حَمِيداً وَتُقْبَلاَ ... وَوَرْشٌ جَمِيعَ الْبَابِ كَانَ مُقَلِّلاَ"
  word: "نَارِ السَّمُومِ"
  scope: "الربع 105 (الحجر 1–49)"
  loc: {at: [[15, 27, "نار"]]}
  imala: {kubra: "أبو عمرو، دوري الكسائي", taqlil: "ورش"}
  marji:
    - {kitab: "البدور الزاهرة", safha: "176", mawdu: "ممال الربع (الحجر 1–49)"}

- id: u15-m002
