  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار (انظر 2-k01)."
  marji:
    - {kitab: "البدور الزاهرة", safha: "177", mawdu: "المدغم الكبير في الربع (الحجر 50–99)"}

