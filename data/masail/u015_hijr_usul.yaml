  qawl: "وَكُلُ ثُلاَثِيٍّ يِزِيدُ فَإِنَّهُ مُمَالٌ كَزَكَّاهَا وَأنْجَى مَعَ ابْتَلى ... وَذَوَاتِ الْيَا لَهُ الْخُلْفُ جُمِّلاَ"
