# ───────────── الإدغام الكبير ─────────────
- id: u15-k001
  bayt: [116, 118, 119, 150, 151]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ"
  word: "نَحْنُ نَزَّلْنَا، لَنَحْنُ نُحْيِي، قَالَ رَبُّكَ، قَالَ لَمْ، قَالَ رَبِّ (معًا)، بِمُخْرَجِينَ نَبِّئْ"
  scope: "الربع 105 (الحجر 1–49)"
  loc: {at: [[15, 9, "نحن"], [15, 23, "لنحن"], [15, 28, "قال"], [15, 33, "قال"], [15, 36, "قال"], [15, 39, "قال"], [15, 48, "بمخرجين"]], span: 2}
  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار (انظر 2-k01). «بِمُخْرَجِينَ» آخر الآية 48 تُدغم نونه في نون «نَبِّئْ» أول الآية 49 وصلًا."
  marji:
    - {kitab: "البدور الزاهرة", safha: "176", mawdu: "المدغم الكبير في الربع (الحجر 1–49)"}

- id: u15-k002
