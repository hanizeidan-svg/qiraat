- id: 22-893a
  bayt: [893]
  qawl: "سُكَارى مَعًا سَكْرى شَفاَ"
  rumuz: "ش (شفا) = حمزة والكسائي"
  word: سُكَارَى وَمَا هُمْ بِسُكَارَى
  scope: موضعان (الحج 2)
  loc: {at: [[22, 2, "سكارى"], [22, 2, "بسكارى"]]}
  readings:
    - {by: "حمزة، الكسائي", tahwil: [["سُكَارَى", "سَكْرَى"]], wasf: "بفتح السين وإسكان الكاف بلا ألف"}
    - {by: "الباقون", wasf: "بضم السين وفتح الكاف وألف بعدها", dalil: "سُكَارى (لفظًا)، ومفهوم: «سكرى» لمن ذُكر", ramz: "—"}
  note: "إمالتها من الأصول. و«لَا تَقْرَبُوا الصَّلَاةَ وَأَنْتُمْ سُكَارَى» (النساء 43) بالضم والألف للجميع."

- id: 22-893b
