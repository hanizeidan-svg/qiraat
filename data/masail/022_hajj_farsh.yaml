  qawl: "وَمُحَرَّكٌ لِيَقْطَعْ بِكَسْرِ الَّلامِ كَمْ جِيدُهُ حَلاَ"
  rumuz: "ك (كم) = ابن عامر، ج (جيده) = ورش، ح (حلا) = أبو عمرو"
  word: ثُمَّ لْيَقْطَعْ
