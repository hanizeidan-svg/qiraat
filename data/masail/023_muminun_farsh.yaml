- id: 23-903c
  bayt: [903, 904]
  qawl: "وَعَظْمًا كَذِي صِلاَ مَعَ الْعَظْمِ"
  rumuz: "ك (كذي) = ابن عامر، ص (صلا) = شعبة"
  word: عِظَامًا فَكَسَوْنَا الْعِظَامَ
  scope: موضع واحد (كلمتان)
