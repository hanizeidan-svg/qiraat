  qawl: "وَاكْسِرِ الْوِلاَ وَأَنَّ ثَوى وَالنُّونَ خَفِّفْ كَفَى"
  rumuz: "ث (ثوى) = الكوفيون، ك (كفى) = ابن عامر"
