    - {by: "ابن كثير، أبو عمرو", lafz: "تَتْرًا", wasf: "بالتنوين (ويقفان بالألف)"}
    - {by: "الباقون", lafz: "تَتْرَى", wasf: "بلا تنوين", dalil: "مفهوم: التنوين لمن ذُكر", ramz: "—"}
  note: "الإمالة فيه على الأصول: حمزة والكسائي بالإمالة، وورش بالتقليل (ذات راء)، ولأبي عمرو في الوقف على المنوّن ما في باب الإمالة (البيت 338 «وَتَتْرًا تَزَيَّلاَ»)."

- id: 23-905c
