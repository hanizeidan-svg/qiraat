    - {by: "ابن عامر", lafz: "وَأَنْ", wasf: "بفتح الهمزة وتخفيف النون (ساكنة)",
       dalil: "وَالنُّونَ خَفِّفْ كَفَى", ramz: "ك (كفى) = ابن عامر"}
