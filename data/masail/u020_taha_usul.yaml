    - {by: "الباقون", hal: "وصلًا", lafz: "يَأْتِهِي", wasf: "بكسر الهاء مع الصلة", dalil: "وَمَا قَبْلَهُ التَّحْرِيكُ لِلْكُلِّ وُصِّلاَ", ramz: "—"}
