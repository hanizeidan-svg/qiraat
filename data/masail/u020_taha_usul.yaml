# أصول سورة طه من «البدور الزاهرة» (ص201–209): الممال (رءوس الآي وغيرها) والمدغم لكل ربع، وياءات الإضافة والزوائد، وهاء «يأته».
# طه إحدى السور الإحدى عشرة: رءوس آيها يميلها حمزة والكسائي، ويقللها ورش قولًا واحدًا، ويقللها أبو عمرو إلا ذوات الراء فيميلها (ص202–204).
# إمالة «طه» في 010_yunus_farsh.yaml (20-739a)، و«رأى» في 006_anam_farsh.yaml، فلم تُكرَّرا.

# ───────────── الإمالة ─────────────
