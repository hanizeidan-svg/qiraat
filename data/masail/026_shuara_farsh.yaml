- id: 26-928a
  bayt: [928]
  qawl: "وَالأيْكَةِ اللاَّمُ سَاكِنٌ مَعَ الْهَمْزِ وَاخْفِضْهُ وَفِي صَادَ غَيْطَلاَ"
  rumuz: "غ (غيطلا) = الكوفيون وأبو عمرو"
  word: أَصْحَابُ الْأَيْكَةِ
  scope: موضعان (الشعراء 176، ص 13)
  loc: {at: [[26, 176, "الأيكة"], [38, 13, "الأيكة"]]}
  readings:
    - {by: "أبو عمرو، عاصم، حمزة، الكسائي", lafz: "الْأَيْكَةِ", wasf: "بلام ساكنة بعدها همزة مفتوحة، وخفض التاء"}
    - {by: "الباقون", lafz: "لَيْكَةَ", wasf: "بلام مفتوحة بلا همزة قبلها ولا بعدها، وفتح التاء (ممنوعًا من الصرف)",
       dalil: "مفهوم: ضد السكون والهمز والخفض", ramz: "—"}
  note: "موضعا الحجر 78 وق 14 «الْأَيْكَةِ» للجميع (ولورش النقل فيهما على أصله)."

