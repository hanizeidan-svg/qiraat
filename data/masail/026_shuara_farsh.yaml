  rumuz: "ع (علو) = حفص، سما = نافع وابن كثير وأبو عمرو"
  word: نَزَلَ بِهِ الرُّوحُ الْأَمِينُ
  scope: موضع واحد
  loc: {at: [[26, 193, "نزل"]], span: 4}
  readings:
    - {by: "نافع، ابن كثير، أبو عمرو، حفص", lafz: "نَزَلَ بِهِ الرُّوحُ الْأَمِينُ", wasf: "بتخفيف الزاي ورفع «الروح الأمين»"}
