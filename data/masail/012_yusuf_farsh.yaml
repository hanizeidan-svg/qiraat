  note: "ولقنبل في إثبات الياء «نَرْتَعِي» خلاف (باب الزوائد، البيت 441)."

- id: 12-775a
  bayt: [775, 776]
  qawl: "وَبُشْرَايَ حَذْفُ الْيَاءِ ثَبْتٌ وَمُيِّلاَ شِفَاءً وَقَلِّلْ جِهْبِذًا وَكِلاَهُمَا عَنِ ابْنِ الْعَلاَ وَالْفَتْحُ عَنْهُ تَفَضَّلاَ"
  rumuz: "ث (ثبت) = الكوفيون (حذف الياء)؛ ش (شفاء) = حمزة والكسائي (الإمالة)؛ ج (جهبذا) = ورش (التقليل)؛ «ابن العلا» = أبو عمرو"
  word: يَا بُشْرَى هَذَا غُلَامٌ
  scope: موضع واحد
  loc: {at: [[12, 19, "بشرى"]]}
  readings:
    - {by: "حمزة، الكسائي", lafz: "بُشْرَى", wasf: "بحذف ياء الإضافة، مع الإمالة الكبرى",
       dalil: "وَبُشْرَايَ حَذْفُ الْيَاءِ ثَبْتٌ وَمُيِّلاَ شِفَاءً", ramz: "ث (ثبت)، ش (شفاء)"}
    - {by: "عاصم", lafz: "بُشْرَى", wasf: "بحذف ياء الإضافة، مع الفتح", dalil: "وَبُشْرَايَ حَذْفُ الْيَاءِ ثَبْتٌ", ramz: "ث (ثبت) = الكوفيون"}
    - {by: "ورش", lafz: "بُشْرَايَ", wasf: "بياء مفتوحة بعد الألف، مع التقليل", dalil: "وَقَلِّلْ جِهْبِذًا", ramz: "ج (جهبذا) = ورش"}
    - {by: "أبو عمرو", lafz: "بُشْرَايَ", wasf: "بياء مفتوحة بعد الألف، مع الفتح", dalil: "وَالْفَتْحُ عَنْهُ تَفَضَّلاَ", ramz: "«ابن العلا» تصريح"}
    - {by: "أبو عمرو", lafz: "بُشْرَايَ", wasf: "بياء مفتوحة بعد الألف، مع التقليل", dalil: "وَكِلاَهُمَا عَنِ ابْنِ الْعَلاَ", ramz: "«ابن العلا» تصريح"}
    - {by: "أبو عمرو", lafz: "بُشْرَايَ", wasf: "بياء مفتوحة بعد الألف، مع الإمالة الكبرى", dalil: "وَكِلاَهُمَا عَنِ ابْنِ الْعَلاَ", ramz: "«ابن العلا» تصريح"}
    - {by: "الباقون", lafz: "بُشْرَايَ", wasf: "بياء مفتوحة بعد الألف، مع الفتح", dalil: "مفهوم: الحذف لثبت والإمالة والتقليل لمن ذُكر", ramz: "—"}
  review: "ما يُقرأ به لأبي عمرو من الأوجه الثلاثة من طريق الشاطبية، وتوزيعها على الدوري والسوسي، وترتيبها (النظم يفضّل الفتح)."

