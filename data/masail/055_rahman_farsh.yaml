       dalil: "وَوَالْحَبُّ ذُو الرَّيْحاَنِ رَفْعُ ثَلاَثِهَا بِنَصْبٍ كَفَى", ramz: "ك (كفى) = ابن عامر"}
    - {by: "حمزة، الكسائي", lafz: "وَالْحَبُّ ذُو الْعَصْفِ وَالرَّيْحَانِ", wasf: "برفع الحب وذو وخفض الريحان",
