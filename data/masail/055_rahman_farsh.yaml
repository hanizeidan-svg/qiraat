- id: 55-1055b
  bayt: [1055, 1056, 1057]
  qawl: "وَكَسْرَ مِيمِ يَطْمِثْ فِي الاولَى ضُمَّ تُهْدى وَتُقْبَلاَ وَقَالَ بِهِ لِلَّيْثِ فِي الثَّانِ وَحْدَهُ شُيُوخٌ وَنَصُّ اللَّيْثِ بِالضَّمِّ الاوَّلاَ وَقَوْلُ الْكِسَائِي ضُمَّ أَيَّهُمَا تَشَا"
  rumuz: "ت (تهدى) = دوري الكسائي؛ «الليث» تصريح = أبو الحارث"
  word: لَمْ يَطْمِثْهُنَّ (الموضع الأول)
  scope: موضع واحد (الرحمن 56)
  loc: {at: [[55, 56, "يطمثهن"]]}
  readings:
    - {by: "دوري الكسائي", lafz: "يَطْمُثْهُنَّ", wasf: "بضم الميم",
       dalil: "وَكَسْرَ مِيمِ يَطْمِثْ فِي الاولَى ضُمَّ تُهْدى", ramz: "ت (تهدى) = دوري الكسائي"}
    - {by: "أبو الحارث", lafz: "يَطْمِثْهُنَّ", wasf: "بكسر الميم (مع ضم الثاني)",
       dalil: "وَقَالَ بِهِ لِلَّيْثِ فِي الثَّانِ وَحْدَهُ شُيُوخٌ", ramz: "«الليث» تصريح = أبو الحارث"}
    - {by: "أبو الحارث", lafz: "يَطْمُثْهُنَّ", wasf: "بضم الميم (مع كسر الثاني)",
       dalil: "وَنَصُّ اللَّيْثِ بِالضَّمِّ الاوَّلاَ", ramz: "«الليث» تصريح = أبو الحارث"}
    - {by: "الباقون", lafz: "يَطْمِثْهُنَّ", wasf: "بكسر الميم", dalil: "مفهوم: الضم لمن ذُكر", ramz: "—"}
  note: "لا يُجمع الضم في الموضعين: من ضم أحدهما كسر الآخر («ضُمَّ أَيَّهُمَا تَشَا»). فلأبي الحارث وجهان متلازمان: كسر الأول مع ضم الثاني، أو ضم الأول مع كسر الثاني."
  review: "المعمول به في «يطمثهن» للكسائي: هل للدوري ضم الأول وحده، ولأبي الحارث الوجهان المذكوران بهذا الترتيب؟"

