- id: 24-915a
  bayt: [915]
  qawl: "وَدُرِّيٌّ اكْسِرْ ضَمَّهُ حُجَّةً رِضا وَفِي مَدِّهِ وَالْهَمْزِ صُحْبَتُهُ حَلاَ"
  rumuz: "ح (حجة) = أبو عمرو، ر (رضا) = الكسائي؛ صحبة = حمزة والكسائي وشعبة، ح (حلا) = أبو عمرو"
  word: كَوْكَبٌ دُرِّيٌّ
  scope: موضع واحد
  loc: {at: [[24, 35, "دري"]]}
  readings:
    - {by: "أبو عمرو، الكسائي", lafz: "دِرِّيءٌ", wasf: "بكسر الدال، ومد الياء بعدها همزة مرفوعة",
       dalil: "وَدُرِّيٌّ اكْسِرْ ضَمَّهُ حُجَّةً رِضا وَفِي مَدِّهِ وَالْهَمْزِ صُحْبَتُهُ حَلاَ"}
    - {by: "حمزة، شعبة", lafz: "دُرِّيءٌ", wasf: "بضم الدال، ومد الياء بعدها همزة مرفوعة",
       dalil: "وَفِي مَدِّهِ وَالْهَمْزِ صُحْبَتُهُ حَلاَ", ramz: "صحبة = حمزة والكسائي وشعبة"}
    - {by: "الباقون", lafz: "دُرِّيٌّ", wasf: "بضم الدال وتشديد الياء بلا همز", dalil: "مفهوم: الكسر والمد والهمز لمن ذُكر", ramz: "—"}
  note: "ولحمزة وقفًا إبدال الهمزة ياءً وإدغام الياء فيها «دُرِّيّْ» على أصله في الوقف على الهمز."

