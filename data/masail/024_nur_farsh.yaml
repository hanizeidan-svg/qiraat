  scope: موضع واحد (النور 2)
  loc: {at: [[24, 2, "رأفة"]]}
  readings:
    - {by: "ابن كثير", lafz: "رَأَفَةٌ", wasf: "بفتح الهمزة"}
    - {by: "الباقون", lafz: "رَأْفَةٌ", wasf: "بإسكان الهمزة", dalil: "مفهوم: ضد التحريك", ramz: "—"}
  note: "«رَأْفَةً وَرَحْمَةً» في الحديد 27 بالإسكان للجميع. وللسوسي إبدال الهمزة الساكنة ألفًا «رَافَةٌ»، ولحمزة كذلك وقفًا، على أصليهما في باب الهمز المفرد ووقف حمزة."

