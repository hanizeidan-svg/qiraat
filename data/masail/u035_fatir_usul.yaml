- id: u35-m003
  bayt: [291, 311, 314, 335, 336]
  qawl: "وَمَا بَعْدَ رَاءٍ شَاعَ حُكْمًا ... وَذُوا الرَّاءِ وَرْشٌ بَيْنَ بَيْنَ ... وَقَبْلَ سُكُونٍ قِفْ بِمَا فِي أُصُولِهِمْ وَذُو الرَّاءِ فِيهِ الخُلْفُ في الْوَصْلِ يُجتَلاَ"
