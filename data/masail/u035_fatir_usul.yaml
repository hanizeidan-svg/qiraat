    - {by: "ورش", hal: "وقفًا", wasf: "بالتقليل"}
    - {by: "الباقون", hal: "وقفًا", wasf: "بالفتح"}
    - {by: "السوسي", hal: "وصلًا", wasf: "بفتح الراء", dalil: "وَقَبْلَ سُكُونٍ قِفْ بِمَا فِي أُصُولِهِمْ وَذُو الرَّاءِ فِيهِ الخُلْفُ في الْوَصْلِ يُجتَلاَ"}
    - {by: "السوسي", hal: "وصلًا", wasf: "بإمالة الراء", dalil: "وَقَبْلَ سُكُونٍ قِفْ بِمَا فِي أُصُولِهِمْ وَذُو الرَّاءِ فِيهِ الخُلْفُ في الْوَصْلِ يُجتَلاَ"}
    - {by: "الباقون", hal: "وصلًا", wasf: "تُحذف الألف وصلًا فلا إمالة"}
  note: "قبل ساكن: الإمالة والتقليل عند الوقف، وللسوسي في الوصل الفتح والإمالة في الراء (على ترتيب الوافي ص155: الفتح ثم الإمالة)."
