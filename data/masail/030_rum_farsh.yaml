- id: 30-958a
  bayt: [958]
  qawl: "وَعَاقِبَةُ الثَّانِي سَمَا"
  rumuz: "سما = نافع وابن كثير وأبو عمرو"
  word: ثُمَّ كَانَ عَاقِبَةَ الَّذِينَ أَسَاءُوا
  scope: موضع واحد (الثاني في الروم)
  loc: {at: [[30, 10, "عاقبة"]]}
