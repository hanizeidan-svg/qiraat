  qawl: "لِيَرْبُوا خِطَابٌ ضُمَّ وَالْوَاوُ سَاكِنٌ أَتَى"
  rumuz: "أ (أتى) = نافع"
  word: لِيَرْبُوَ فِي أَمْوَالِ النَّاسِ
  scope: موضع واحد
  loc: {at: [[30, 39, "ليربو"]]}
