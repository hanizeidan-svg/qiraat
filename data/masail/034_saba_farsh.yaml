  scope: موضع واحد
  loc: {at: [[34, 3, "عالم"]]}
  readings:
    - {by: "حمزة، الكسائي", lafz: "عَلَّامِ", wasf: "بلام مشددة بعدها ألف مع خفض الميم",
       dalil: "وَعَالِمِ قُلْ عَلاَّمِ شَاعَ", ramz: "ش (شاع) = حمزة والكسائي"}
    - {by: "نافع، ابن عامر", lafz: "عَالِمُ", wasf: "بوزن فاعل مع رفع الميم",
       dalil: "وَرَفْعُ خَفْضِهِ عَمَّ", ramz: "عم = نافع وابن عامر"}
    - {by: "الباقون", wasf: "بوزن فاعل مع خفض الميم", dalil: "مفهوم: لفظ الترجمة «عَالِمِ» على الخفض", ramz: "—"}

