- id: u7-y001
  bayt: [407, 409, 410, 713]
  qawl: "وَفِي اللاَّمِ لِلتَّعْرِيفِ أَرْبَعُ عَشْرَةٍ فَإِسْكَانُهَا فَاشٍ وَعَهْدِيَ فِي عُلاَ ... مَعَ الأَنَبِيَا رَبِّي فِي الَاعْرَافِ كمَّلاَ ... وَرَبِّي مَعِي بَعْدِي وَإِنِّي كِلاَهُمَا عَذَابِيَ آيَاتِي مُضَافَاتُهَا الْعُلاَ"
  word: "رَبِّيَ الْفَوَاحِشَ"
  scope: "موضع واحد (قبل لام التعريف)"
  loc: {at: [[7, 33, "ربي"]], next: "^الفواحش$"}
  yaa: {iskan: "حمزة"}
  note: "حمزة يسكنها فتُحذف وصلًا لالتقاء الساكنين."
  marji:
