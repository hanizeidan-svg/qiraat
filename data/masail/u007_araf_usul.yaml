# أصول سورة الأعراف من «البدور الزاهرة» (ص114–128)، الأرباع 61–70
#   الإمالة والإدغام (الكبير والصغير) من قوائم «الممال» و«المدغم» في آخر كل ربع؛
#   وياءات الإضافة والزوائد وهاءات الكناية الخاصة من فرش السورة في البدور.
#   الصيغة المختصرة (imala/kabir/saghir/yaa/zaida) على docs/USUL_METHOD.md.

# ───────────── هاء الكناية ─────────────
- id: u7-h001
  bayt: [166, 167]
  qawl: "وَعَى نَفَرٌ أَرْجِئْهُ بِالْهَمْزِ سَاكِنًا وَفي الْهَاءِ ضَمٌّ لَفَّ دَعْوَاهُ حَرْمَلاَ وَأَسْكِنْ نَصِيرًا فَازَ وَاكْسِرْ لِغَيْرِهِمْ وَصِلْهَا جَوَادًا دُونَ رَيْبٍ لِتُوصَلاَ"
  word: "أَرْجِهْ"
  scope: "موضع واحد (الأعراف 111)"
  loc: {at: [[7, 111, "أرجه"]]}
  readings:
    - {by: "قالون", hal: "وصلًا", lafz: "أَرْجِهِ", wasf: "بترك الهمز وكسر الهاء بلا صلة"}
