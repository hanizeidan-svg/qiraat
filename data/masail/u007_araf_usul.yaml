    - {by: "ابن كثير، هشام", hal: "وصلًا", lafz: "أَرْجِئْهُو", wasf: "بهمزة ساكنة وضم الهاء مع الصلة"}
    - {by: "أبو عمرو", hal: "وصلًا", lafz: "أَرْجِئْهُ", wasf: "بهمزة ساكنة وضم الهاء بلا صلة"}
    - {by: "ابن ذكوان", hal: "وصلًا", lafz: "أَرْجِئْهِ", wasf: "بهمزة ساكنة وكسر الهاء بلا صلة"}
    - {by: "عاصم، حمزة", lafz: "أَرْجِهْ", wasf: "بترك الهمز وإسكان الهاء"}
    - {by: "قالون، ورش، الكسائي", hal: "وقفًا", lafz: "أَرْجِهْ", wasf: "بترك الهمز وإسكان الهاء وقفًا"}
    - {by: "الباقون", hal: "وقفًا", lafz: "أَرْجِئْهْ", wasf: "بالهمز وإسكان الهاء وقفًا"}
