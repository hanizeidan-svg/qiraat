       dalil: "وَمَا قَبْلَهُ التَّسْكِينُ لاِبْنِ كَثِيرِهِمْ", ramz: "«ابن كثير» تصريح"}
    - {by: "الباقون", hal: "وصلًا", wasf: "بكسر الهاء بلا صلة", dalil: "مفهوم: تخصيص ابن كثير بالصلة بعد الساكن", ramz: "—"}
