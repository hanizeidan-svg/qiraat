# ───────────── الإدغام الكبير ─────────────
- id: 2-k01
  bayt: [116, 118, 119]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ ... وَمَا كَانَ مِنْ مِثْلَيْنِ في كِلْمَتَيْهِمَا فَلاَبُدَّ مِنْ إدْغَامِ مَا كانَ أَوَّلاَ كَيَعْلَمُ مَا فِيهِ هُدًى"
  word: المثلان من كلمتين (فِيهِ هُدًى، قِيلَ لَهُمْ، لَذَهَبَ بِسَمْعِهِمْ)
  scope: حيث وقع
  loc: {at: [[2, 2, "فيه"], [2, 11, "قيل"], [2, 13, "قيل"], [2, 20, "لذهب"]], span: 2}
  readings:
    - {by: "السوسي", wasf: "بإدغام الحرف الأول في الثاني", ramz: "«أبو عمرو» تصريح، والعمل على الإدغام للسوسي"}
    - {by: "الباقون", wasf: "بالإظهار", dalil: "مفهوم: الإدغام الكبير لأبي عمرو وحده", ramz: "—"}
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار (وظاهر النظم أنه لأبي عمرو). النموذج: البقرة 1–20. وللسوسي في «فِيهِ هُّدًى» الروم أيضًا (البيت 155). ولا روم ولا إشمام في «لَذَهَب بِّسَمْعِهِمْ» لالتقاء الباءين."

