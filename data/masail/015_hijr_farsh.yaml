- id: 15-802c
  bayt: [802, 803, 528, 529]
  qawl: "تَنزَّلُ ضَمُّ التَّا لِشُعْبَةَ مُثِّلاَ وَبِالنُّونِ فِيهاَ وَاكْسِرِ الزَّايَ وَانُصِبِ الْمَلائِكَةَ المَرْفُوعَ عَنْ شَائِدٍ عُلاَ"
  rumuz: "«شعبة» تصريح؛ ع (عن، علا) = حفص، ش (شائد) = حمزة والكسائي؛ وتشديد التاء للبزي «تَنَزَّلُ عَنْهُ أَرْبَعٌ» (البيت 528)"
  word: مَا نُنَزِّلُ الْمَلَائِكَةَ
  scope: موضع واحد (الحجر 8)
  loc: {at: [[15, 8, "ننزل"]], span: 2}
  readings:
    - {by: "حفص، حمزة، الكسائي", lafz: "نُنَزِّلُ الْمَلَائِكَةَ", wasf: "بالنون مضمومة وكسر الزاي ونصب الملائكة",
       dalil: "وَبِالنُّونِ فِيهاَ وَاكْسِرِ الزَّايَ وَانُصِبِ الْمَلائِكَةَ المَرْفُوعَ عَنْ شَائِدٍ عُلاَ", ramz: "ع (عن) = حفص، ش (شائد) = حمزة والكسائي"}
    - {by: "شعبة", lafz: "تُنَزَّلُ الْمَلَائِكَةُ", wasf: "بالتاء مضمومة وفتح الزاي ورفع الملائكة",
       dalil: "تَنزَّلُ ضَمُّ التَّا لِشُعْبَةَ مُثِّلاَ", ramz: "«شعبة» تصريح"}
    - {by: "البزي", hal: "وصلًا", lafz: "تَّنَزَّلُ الْمَلَائِكَةُ", wasf: "بتشديد التاء وصلًا مع المد المشبع في «ما»، وفتح الزاي ورفع الملائكة",
       dalil: "تَنَزَّلُ عَنْهُ أَرْبَعٌ (البيت 528) — وانظر 2-135", ramz: "«عنه» = البزي"}
    - {by: "البزي", hal: "وقفًا", lafz: "تَنَزَّلُ الْمَلَائِكَةُ", wasf: "بتخفيف التاء عند الابتداء، وفتح الزاي ورفع الملائكة",
       dalil: "وَفي الْوَصْلِ لِلْبَزِّيِّ (التشديد في الوصل خاصة)", ramz: "«البزي» تصريح"}
    - {by: "الباقون", lafz: "تَنَزَّلُ الْمَلَائِكَةُ", wasf: "بالتاء مفتوحة مخففة وفتح الزاي ورفع الملائكة",
       dalil: "تَنزَّلُ (لفظ الترجمة) ومفهوم الضم لشعبة والنون لعن شائد", ramz: "—"}

