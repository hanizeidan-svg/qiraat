    - {by: "نافع", lafz: "تُجْبَى", wasf: "بالتاء على التأنيث", dalil: "مفهوم: الياء لرمز «خليط» فبقي نافع بالتاء", ramz: "—"}
  note: "الإمالة فيه على الأصول: حمزة والكسائي بالإمالة، ولورش الفتح والتقليل."

- id: 28-950b
