# فرش سورة القصص — الأبيات 945–950 (الحقول كما في 002_baqara_farsh_445-474.yaml)
# يُترك لمرحلة الأصول: ياءات الإضافة (البيت 951).

- id: 28-945a
  bayt: [945]
  qawl: "وَفِي نُرِيَ الْفَتْحَانِ مَعْ أَلِفٍ وَيَائِهِ وَثَلاَثٌ رَفْعُهَا بَعْدُ شُكِّلاَ"
  rumuz: "ش (شكلا) = حمزة والكسائي"
  word: وَنُرِيَ فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا
  scope: موضع واحد
  loc: {at: [[28, 6, "ونري"]], span: 4}
  readings:
    - {by: "حمزة، الكسائي", lafz: "وَيَرَى فِرْعَوْنُ وَهَامَانُ وَجُنُودُهُمَا", wasf: "بالياء مفتوحة وفتح الراء وألف بعدها، ورفع الأسماء الثلاثة بعده"}
    - {by: "الباقون", lafz: "وَنُرِيَ فِرْعَوْنَ وَهَامَانَ وَجُنُودَهُمَا", wasf: "بالنون مضمومة وكسر الراء وفتح الياء، ونصب الأسماء الثلاثة", dalil: "مفهوم: لفظ الترجمة «نُرِيَ»", ramz: "—"}
  note: "ولحمزة والكسائي إمالة «يَرَى» إن وُقف عليها، على أصلهما."

- id: 28-946a
  bayt: [946]
  qawl: "وَحُزْنًا بِضَمٍّ مَعْ سُكُونٍ شَفَا"
  rumuz: "ش (شفا) = حمزة والكسائي"
  word: عَدُوًّا وَحَزَنًا
  scope: موضع واحد
  loc: {at: [[28, 8, "وحزنا"]]}
  readings:
    - {by: "حمزة، الكسائي", lafz: "وَحُزْنًا", wasf: "بضم الحاء وإسكان الزاي"}
    - {by: "الباقون", lafz: "وَحَزَنًا", wasf: "بفتح الحاء والزاي", dalil: "مفهوم: ضد الضم والسكون", ramz: "—"}

- id: 28-946b
  bayt: [946]
  qawl: "وَيَصْدُرَ اضْمُمْ وَكَسْرُ الضَّمِّ ظَامِيهِ أَنْهَلاَ"
  rumuz: "ظ (ظاميه) = الكوفيون وابن كثير، أ (أنهلا) = نافع"
  word: حَتَّى يُصْدِرَ الرِّعَاءُ
  scope: موضع واحد
  loc: {at: [[28, 23, "يصدر"]]}
  readings:
    - {by: "نافع، ابن كثير، عاصم، حمزة، الكسائي", lafz: "يُصْدِرَ", wasf: "بضم الياء وكسر الدال"}
    - {by: "الباقون", lafz: "يَصْدُرَ", wasf: "بفتح الياء وضم الدال", dalil: "مفهوم: لفظ الترجمة «وَيَصْدُرَ»", ramz: "—"}
  note: "إشمام الصاد زايًا لحمزة والكسائي في المسألة العامة 4-603a (البيت 603)."

- id: 28-947a
  bayt: [947]
  qawl: "وَجِذْوَةٍ اضْمُمْ فُزْتَ وَالْفَتْحَ نَلْ"
  rumuz: "ف (فزت) = حمزة، ن (نل) = عاصم"
  word: أَوْ جَذْوَةٍ مِنَ النَّارِ
  scope: موضع واحد
  loc: {at: [[28, 29, "جذوة"]]}
  readings:
    - {by: "حمزة", lafz: "جُذْوَةٍ", wasf: "بضم الجيم", dalil: "وَجِذْوَةٍ اضْمُمْ فُزْتَ", ramz: "ف (فزت) = حمزة"}
    - {by: "عاصم", lafz: "جَذْوَةٍ", wasf: "بفتح الجيم", dalil: "وَالْفَتْحَ نَلْ", ramz: "ن (نل) = عاصم"}
    - {by: "الباقون", lafz: "جِذْوَةٍ", wasf: "بكسر الجيم", dalil: "مفهوم: لفظ الترجمة «وَجِذْوَةٍ»", ramz: "—"}

- id: 28-947b
  bayt: [947]
  qawl: "وَصُحْبَةٌ كَهْفُ ضَمِّ الرَّهْبِ وَاسْكِنْهُ ذُبَّلاَ"
  rumuz: "صحبة = حمزة والكسائي وشعبة، ك (كهف) = ابن عامر (للضم)؛ ذ (ذبلا) = ابن عامر والكوفيون (للإسكان)"
  word: مِنَ الرَّهْبِ
  scope: موضع واحد
  loc: {at: [[28, 32, "الرهب"]]}
  readings:
    - {by: "ابن عامر، شعبة، حمزة، الكسائي", lafz: "الرُّهْبِ", wasf: "بضم الراء وإسكان الهاء"}
    - {by: "حفص", lafz: "الرَّهْبِ", wasf: "بفتح الراء وإسكان الهاء",
       dalil: "وَاسْكِنْهُ ذُبَّلاَ (ولم يدخل في رمز الضم)", ramz: "ذ (ذبلا) = ابن عامر والكوفيون"}
    - {by: "الباقون", lafz: "الرَّهَبِ", wasf: "بفتح الراء والهاء", dalil: "مفهوم: ضد الضم والإسكان", ramz: "—"}

- id: 28-948a
  bayt: [948]
  qawl: "يُصَدِّقُنِيَ ارْفَعْ جَزْمَهُ فِي نُصُوصِهِ"
  rumuz: "ف (في) = حمزة، ن (نصوصه) = عاصم"
  word: رِدْءًا يُصَدِّقُنِي
  scope: موضع واحد
  loc: {at: [[28, 34, "يصدقني"]]}
  readings:
    - {by: "عاصم، حمزة", lafz: "يُصَدِّقُنِي", wasf: "برفع القاف"}
    - {by: "الباقون", lafz: "يُصَدِّقْنِي", wasf: "بجزم القاف", dalil: "مفهوم: الرفع لمن ذُكر", ramz: "—"}
  note: "ولنافع في «رِدْءًا» النقل «رِدًا» وصلًا ووقفًا (باب نقل الحركة)."

- id: 28-948b
  bayt: [948]
  qawl: "وَقُلْ قَالَ مُوسَى وَاحْذِفِ الْوَاوَ دُخْلُلاَ"
  rumuz: "د (دخللا) = ابن كثير"
  word: وَقَالَ مُوسَى رَبِّي أَعْلَمُ
  scope: موضع واحد
  loc: {at: [[28, 37, "وقال"]]}
  readings:
    - {by: "ابن كثير", lafz: "قَالَ", wasf: "بحذف الواو"}
    - {by: "الباقون", lafz: "وَقَالَ", wasf: "بالواو", dalil: "مفهوم: الحذف لمن ذُكر", ramz: "—"}

- id: 28-949a
  bayt: [949]
  qawl: "نَمَا نَفَرٌ بِالضَّمِّ وَالْفَتْحِ يَرْجِعُونَ"
  rumuz: "ن (نما) = عاصم، نفر = ابن كثير وأبو عمرو وابن عامر"
  word: إِلَيْنَا لَا يُرْجَعُونَ
  scope: موضع واحد
  loc: {at: [[28, 39, "يرجعون"]]}
  readings:
    - {by: "ابن كثير، أبو عمرو، ابن عامر، عاصم", lafz: "يُرْجَعُونَ", wasf: "بضم الياء وفتح الجيم (مبنيًّا للمفعول)"}
    - {by: "الباقون", lafz: "يَرْجِعُونَ", wasf: "بفتح الياء وكسر الجيم (مبنيًّا للفاعل)", dalil: "مفهوم: الضم والفتح لمن ذُكر", ramz: "—"}
  note: "تقدّم الرمز على الكلمة القرآنية هنا خلافًا للغالب."

- id: 28-949b
  bayt: [949]
  qawl: "سِحْرَانِ ثِقْ فِي سَاحِرَانِ فَتُقْبَلاَ"
  rumuz: "ث (ثق) = الكوفيون"
  word: قَالُوا سِحْرَانِ تَظَاهَرَا
  scope: موضع واحد
  loc: {at: [[28, 48, "سحران"]]}
  readings:
    - {by: "عاصم، حمزة، الكسائي", lafz: "سِحْرَانِ", wasf: "بكسر السين وإسكان الحاء بلا ألف"}
    - {by: "الباقون", lafz: "سَاحِرَانِ", wasf: "بفتح السين وألف بعدها وكسر الحاء", dalil: "مفهوم: «في ساحران» أي للباقين", ramz: "—"}

