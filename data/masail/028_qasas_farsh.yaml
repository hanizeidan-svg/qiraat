    - {by: "الباقون", lafz: "تَعْقِلُونَ", wasf: "بالتاء على الخطاب", dalil: "مفهوم: ضد الغيب", ramz: "—"}
  note: "الوافي ص338: «يعقلون» بالغيب لأبي عمرو وبالخطاب لغيره، ولم يذكر خلفًا للسوسي؛ فالغيب لأبي عمرو بروايتيه من طريق الشاطبية."

