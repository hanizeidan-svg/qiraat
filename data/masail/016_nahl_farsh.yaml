- id: 16-813b
  bayt: [813, 814]
  qawl: "وَنَجْزِيَنَّ الَّذِينَ النُّونُ دَاعِيهِ نُوِّلاَ مَلَكْتَ وَعَنْهُ نَصَّ الَاخْفَشُ يَاءَهُ وَعَنْهُ رَوَى النَّقَّاشُ نُونًا مُوَهَّلاَ"
  rumuz: "د (داعيه) = ابن كثير، ن (نولا) = عاصم، م (ملكت) = ابن ذكوان؛ «عنه» = ابن ذكوان"
  word: وَلَنَجْزِيَنَّ الَّذِينَ صَبَرُوا
  scope: موضع واحد (النحل 96)
  loc: {at: [[16, 96, "ولنجزين"]]}
  readings:
    - {by: "ابن كثير، عاصم", lafz: "وَلَنَجْزِيَنَّ", wasf: "بالنون", dalil: "وَنَجْزِيَنَّ الَّذِينَ النُّونُ دَاعِيهِ نُوِّلاَ"}
    - {by: "ابن ذكوان", lafz: "وَلَيَجْزِيَنَّ", wasf: "بالياء (نص الأخفش)", dalil: "وَعَنْهُ نَصَّ الَاخْفَشُ يَاءَهُ", ramz: "«عنه» = ابن ذكوان"}
    - {by: "ابن ذكوان", lafz: "وَلَنَجْزِيَنَّ", wasf: "بالنون (رواية النقاش عن الأخفش)", dalil: "مَلَكْتَ ... وَعَنْهُ رَوَى النَّقَّاشُ نُونًا مُوَهَّلاَ", ramz: "م (ملكت) = ابن ذكوان"}
    - {by: "الباقون", lafz: "وَلَيَجْزِيَنَّ", wasf: "بالياء", dalil: "مفهوم: النون لمن ذُكر", ramz: "—"}
  note: "«وَلَنَجْزِيَنَّهُمْ أَجْرَهُمْ» (النحل 97) بالنون للجميع. وجها ابن ذكوان على ترتيب الوافي (ص306): «الياء» ثم «النون»، وضعّف الناظم النون بـ«موهلا»، لكن ابن الجزري صحح الوجهين «فيقرأ له بهما»."

