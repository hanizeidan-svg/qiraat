- id: 2-131
  bayt: [543, 544, 280]
  qawl: "وَيَغْفِرْ مَعْ يُعَذِّبْ سَمَا الْعُلاَ شَذَا الْجَزْمِ ... وَالرَّاءُ جَزْمًا بِلاَمِهَا ... طَالَ بِالْخُلْفِ يَذْبُلاَ"
  rumuz: "سما = نافع وابن كثير وأبو عمرو، ش (شذا) = حمزة والكسائي؛ ط = دوري أبي عمرو (بالخلف)، ي = السوسي (البيت 280)"
  word: فَيَغْفِرُ لِمَنْ يَشَاءُ
  scope: موضع واحد
  loc: {at: [[2, 284, "فيغفر"]], span: 2}
  readings:
