    - {by: "السوسي", lafz: "فَيَغْفِر لِّمَنْ", wasf: "بالجزم وإدغام الراء في اللام",
       dalil: "وَالرَّاءُ جَزْمًا بِلاَمِهَا كَوَاصْبِرْ لِحُكْمِ طَالَ بِالْخُلْفِ يَذْبُلاَ", ramz: "ي (يذبلا) = السوسي"}
    - {by: "دوري أبي عمرو", lafz: "فَيَغْفِر لِّمَنْ", wasf: "بالجزم وإدغام الراء في اللام",
       dalil: "وَالرَّاءُ جَزْمًا بِلاَمِهَا ... طَالَ بِالْخُلْفِ", ramz: "ط (طال) = دوري أبي عمرو بالخلف"}
    - {by: "دوري أبي عمرو", lafz: "فَيَغْفِرْ لِمَنْ", wasf: "بالجزم والإظهار",
       dalil: "وَالرَّاءُ جَزْمًا بِلاَمِهَا ... طَالَ بِالْخُلْفِ", ramz: "ط (طال) = دوري أبي عمرو بالخلف"}
    - {by: "الباقون", lafz: "فَيَغْفِرْ لِمَنْ", wasf: "بالجزم والإظهار", dalil: "وَيَغْفِرْ مَعْ يُعَذِّبْ سَمَا الْعُلاَ شَذَا الْجَزْمِ"}
  note: "على ترتيب الوافي (ص136): ذكر الإدغام للدوري بخلف، ثم الإظهار «وهو الوجه الثاني للدورى»."

- id: 2-132
  bayt: [543, 544, 285]
  qawl: "وَيَغْفِرْ مَعْ يُعَذِّبْ سَمَا الْعُلاَ شَذَا الْجَزْمِ ... وَفِي الْبَقَرَهْ فَقُلْ يُعَذِّبْ دَنَا بِالْخُلْفِ جَوْدًا"
  rumuz: "سما + ش = الجزم؛ د (دنا) = ابن كثير بالخلف، ج (جودا) = ورش: إظهار (البيت 285)"
  word: وَيُعَذِّبُ مَنْ يَشَاءُ
  scope: موضع واحد
  loc: {at: [[2, 284, "ويعذب"]], span: 2}
  readings:
    - {by: "ابن عامر، عاصم", lafz: "وَيُعَذِّبُ مَنْ", wasf: "بالرفع", dalil: "مفهوم: الجزم لمن ذُكر", ramz: "—"}
    - {by: "ورش", lafz: "وَيُعَذِّبْ مَنْ", wasf: "بالجزم والإظهار", dalil: "وَفِي الْبَقَرَهْ فَقُلْ يُعَذِّبْ دَنَا بِالْخُلْفِ جَوْدًا", ramz: "ج (جودا) = ورش"}
    - {by: "ابن كثير", lafz: "وَيُعَذِّبْ مَنْ", wasf: "بالجزم والإظهار (وجهًا واحدًا من طريق الحرز)", dalil: "يُعَذِّبْ دَنَا بِالْخُلْفِ", ramz: "د (دنا) = ابن كثير بالخلف"}
    - {by: "الباقون", lafz: "وَيُعَذِّب مَّنْ", wasf: "بالجزم وإدغام الباء في الميم", dalil: "مفهوم: الإظهار لمن ذُكر (والجزم لسما وشذا)"}
  note: "ظاهر النظم الخلف لابن كثير، والمعمول به الإظهار وحده: الوافي ص137: التحقيق أنه «ليس له من طريق النظم وأصله إلا الإظهار». وفيه أن الإظهار لورش «بلا خلاف» (ج = جودا)."

