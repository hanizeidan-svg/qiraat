- id: u41-m018
  bayt: [312, 314]
  qawl: "نَأَى شَرْعُ يُمْنٍ بِاخْتِلاَفٍ وَشُعْبَةٌ في الاِسْرَا وَهُمْ وَالنُّونُ ضَوْءُ سَنًا تلاَ"
  word: وَنَأَىٰ بِجَانِبِهِ
  scope: الربع 193
  loc: {at: [[41, 51, "ونأى"]]}
  readings:
    - {by: "خلف، الكسائي", wasf: "بإمالة النون والهمزة", ramz: "ش (شرع) = حمزة والكسائي في الهمزة، ض س ت (ضوء سنا تلا) = خلف والكسائي في النون"}
    - {by: "خلاد", wasf: "بفتح النون وإمالة الهمزة", ramz: "ش (شرع) = حمزة"}
    - {by: "ورش", wasf: "بالفتح", dalil: "وَذَوَاتِ الْيَا لَهُ الْخُلْفُ جُمِّلاَ"}
    - {by: "ورش", wasf: "بتقليل الهمزة", dalil: "وَذَوَاتِ الْيَا لَهُ الْخُلْفُ جُمِّلاَ"}
    - {by: "الباقون", wasf: "بالفتح", dalil: "مفهوم: الإمالة والتقليل لمن ذُكر", ramz: "—"}
  note: "ولابن ذكوان «وَنَاءَ» بتقديم الألف (فرش 17-826b) بالفتح. ولا إمالة لشعبة هنا (خصّه الناظم بالإسراء). ووجها ورش على ترتيب البدور: الفتح ثم التقليل."
  marji:
    - {kitab: "البدور الزاهرة", safha: "286", mawdu: "ممال الربع 193 (فصلت 47–54)"}
  tahrir:
    - {naw: "خروج عن الطريق", rawi: "السوسي", bayan: "ذكر الناظم للسوسي الخلف في إمالة الهمزة من «نأى» (يُمْنٍ بِاخْتِلاَفٍ)", hukm: "لا يقرأ به؛ ليس للسوسي إلا الفتح", qawl: "خروج عن طريقه فلا يقرأ به", kitab: "البدور الزاهرة", safha: "286"}

