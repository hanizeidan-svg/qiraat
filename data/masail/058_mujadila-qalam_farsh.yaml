       dalil: "وَآمِنْتمُو فِي الْهَمْزَتَيْنِ أُصُولُهُ", ramz: "باب الهمزتين من كلمة"}
    - {by: "ورش", wasf: "بتسهيل الهمزة الثانية بلا إدخال",
       dalil: "وَآمِنْتمُو فِي الْهَمْزَتَيْنِ أُصُولُهُ", ramz: "باب الهمزتين من كلمة"}
    - {by: "البزي", wasf: "بتسهيل الهمزة الثانية بلا إدخال",
       dalil: "وَآمِنْتمُو فِي الْهَمْزَتَيْنِ أُصُولُهُ", ramz: "باب الهمزتين من كلمة"}
    - {by: "هشام", wasf: "بتسهيل الهمزة الثانية مع الإدخال",
       dalil: "وَآمِنْتمُو فِي الْهَمْزَتَيْنِ أُصُولُهُ", ramz: "باب الهمزتين من كلمة"}
    - {by: "هشام", wasf: "بتحقيق الهمزتين مع الإدخال",
       dalil: "وَآمِنْتمُو فِي الْهَمْزَتَيْنِ أُصُولُهُ", ramz: "باب الهمزتين من كلمة"}
    - {by: "الباقون", wasf: "بتحقيق الهمزتين بلا إدخال", dalil: "مفهوم: الباقون على أصلهم بالتحقيق", ramz: "—"}
  note: "نصّ عليها في الأصول أيضًا (البيت 191: «وَأَبْدَلَ قُنْبُلٌ فِي اْلاَعْرَافِ مِنْهَا الْوَاوَ وَالْمُلْكِ مُوصِلاَ»). وأوجه غير قنبل منقولة من أصولهم. الوافي ص 371: قنبل يبدل الأولى واوًا وصلًا، ويحققها إذا وقف على «النشور»، ويسهّل الثانية مطلقًا. الوافي ص 84: لهشام في المفتوحة «التسهيل والتحقيق»، ولورش «الإبدال ألفا، والتسهيل»، والألف المبدلة في «أأمنتم» بالملك تُمد «مدّا أصليّا بمقدار حركتين» (فصُحِّح وصف وجه الإبدال من المد المشبع)؛ الوافي ص 88: الإدخال قبل المفتوحة لهشام بلا خلف. فرُتِّب وجها هشام ووجها ورش على ترتيب الوافي."

