- id: 59-1067b
  bayt: [1067]
  qawl: "وَمَعْ دُولَةً أَنِّث يَكُونُ بِخُلْفِ لا"
  rumuz: "ل (لا) = هشام بالخلف"
  word: كَيْ لَا يَكُونَ دُولَةً
  scope: موضع واحد
  loc: {at: [[59, 7, "يكون"]], span: 2}
  readings:
    - {by: "هشام", lafz: "تَكُونَ دُولَةٌ", wasf: "بتاء التأنيث ورفع «دولة» (كان التامة)"}
    - {by: "هشام", lafz: "يَكُونَ دُولَةٌ", wasf: "بالياء ورفع «دولة»"}
    - {by: "الباقون", lafz: "يَكُونَ دُولَةً", wasf: "بالياء ونصب «دولة»", dalil: "مفهوم: التأنيث لمن ذُكر", ramz: "—"}
  note: "«ومع دولة» أي مع رفع «دولة» على ما هو في لفظ النظم عند الشراح. الوافي ص 369: هشام يرفع «دولة» قولًا واحدًا، و«له في لفظ يكون التأنيث والتذكير»؛ فصُحِّح وجهه الثاني إلى التذكير مع الرفع (لا النصب)، ورُتِّب الوجهان على ترتيب الوافي."

