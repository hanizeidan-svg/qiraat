- id: 58-1066a
  bayt: [1066]
  qawl: "وَكَسْرَ انْشِزُوا فَاضْمُمْ مَعَاً صَفْوَ خُلْفِهِ عُلاً عَمَّ"
  rumuz: "ص (صفو) = شعبة بالخلف، ع (علا) = حفص، عم = نافع وابن عامر"
  word: انْشُزُوا فَانْشُزُوا
  scope: موضعان (المجادلة 11)
  loc: {at: [[58, 11, "ف?انشزوا"]]}
  readings:
    - {by: "نافع، ابن عامر، حفص", wasf: "بضم الشين فيهما"}
    - {by: "شعبة", wasf: "بضم الشين فيهما", ramz: "ص (صفو خلفه) = شعبة بالخلف"}
    - {by: "شعبة", tahwil: [["شُ", "شِ"]], wasf: "بكسر الشين فيهما", ramz: "ص (صفو خلفه) = شعبة بالخلف"}
    - {by: "الباقون", tahwil: [["شُ", "شِ"]], wasf: "بكسر الشين فيهما", dalil: "مفهوم: الضم لمن ذُكر", ramz: "—"}
  note: "الوافي ص 368: الضم لحفص ونافع وابن عامر وشعبة بخلف عنه، والكسر «هو الوجه الثاني لشعبة»؛ فالضم مقدَّم له، على ترتيب الوافي."

