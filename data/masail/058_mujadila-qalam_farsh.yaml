  scope: موضع واحد (المجادلة 8)
  loc: {at: [[58, 8, "ويتناجون"]]}
  readings:
    - {by: "حمزة", lafz: "وَيَنْتَجُونَ", wasf: "بنون ساكنة قبل التاء بلا ألف وضم الجيم"}
