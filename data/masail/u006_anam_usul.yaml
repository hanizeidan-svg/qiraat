  qawl: "وَعَشْرٌ يَلِيهَا الْهَمْزُ بِالضَّمِّ مُشْكَلاَ ... فَعَنْ نَافِعٍ فَافْتَحْ ... وَرَبِّي صِرَاطِي ثُمَّ إِنِّي ثَلاَثَةٌ وَمَحْيَايَ وَالإِسْكَانُ صَحَّ تَحَمُّلاَ"
