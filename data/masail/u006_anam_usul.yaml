- id: u6-k019
  bayt: [116, 118]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ ... وَمَا كَانَ مِنْ مِثْلَيْنِ في كِلْمَتَيْهِمَا فَلاَبُدَّ مِنْ إدْغَامِ مَا كانَ أَوَّلاَ"
  word: "نَحْنُ نَرْزُقُكُمْ، أَظْلَمُ مِمَّنْ، كَذَّبَ بِآيَاتِ، الْعَذَابِ بِمَا"
  scope: "الربع 60 (الأنعام 151–165)"
  loc: {at: [[6, 151, "نحن"], [6, 157, "أظلم"], [6, 157, "كذب"], [6, 157, "العذاب"]], span: 2}
  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار."
  marji:
    - {kitab: "البدور الزاهرة", safha: "114", mawdu: "المدغم الكبير، الربع 60 (الأنعام 151–165)"}

- id: u6-k020
  bayt: [116, 132, 133, 134]
  qawl: "وَإِنْ كِلْمَةٌ حَرْفَانِ فِيهَا تَقَارَبَا فإِدْغَامُهُ لِلْقَافِ في الْكافِ مُجْتَلاَ ... وَهذَا إِذَا مَا قَبْلَهُ مُتَحَرِّكٌ"
  word: "نَرْزُقُكُمْ"
  scope: "الربع 60 (الأنعام 151–165)"
  loc: {at: [[6, 151, "نرزقكم"]]}
  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار. وهو إدغام القاف في الكاف في كلمة واحدة إذا تحرك ما قبلها وكان بعد الكاف ميم."
  marji:
