- id: u6-s009
  bayt: [258, 262, 263, 264]
  qawl: "وَقَدْ سَحَبَتْ ذيْلاً ضَفَا ظَلَّ زَرْنَبٌ جلَتْهُ صَبَاهُ شَاَئِقاً وَمُعَلِّلاَ ... فَأظْهَرَهَا نَجَمٌ بَدَا دَلَّ وَاضِحاً"
