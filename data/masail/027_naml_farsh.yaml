  scope: موضعان (النمل 22، سبأ 15)
  loc: {at: [[27, 22, "سبإ"], [34, 15, "لسبإ"]]}
  readings:
    - {by: "البزي، أبو عمرو", tahwil: [["بَإٍ$", "بَأَ"]], wasf: "بفتح الهمزة بلا تنوين (ممنوعًا من الصرف)",
       dalil: "مَعًا سَبَأَ افْتَحْ دُونَ نُونٍ حِمىً هُدًى", ramz: "ح (حمى) = أبو عمرو، ه (هدى) = البزي"}
