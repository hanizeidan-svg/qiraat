  note: "ولحمزة وهشام وقفًا إبدال الهمزة المتطرفة ألفًا «سَبَا» على أصلهما."

- id: 27-934a
  bayt: [934, 935, 936]
  qawl: "أَلاَ يَسْجُدُوا رَاوٍ وَقِفْ مُبْتَلىً أَلاَ وَياَ وَاسْجُدُوا وَأبْدَأْهُ بِالضَّمِّ مُوصِلاَ"
  rumuz: "ر (راو) = الكسائي"
  word: أَلَّا يَسْجُدُوا لِلَّهِ
  scope: موضع واحد
  loc: {at: [[27, 25, "ألا"]], span: 2}
  readings:
    - {by: "الكسائي", lafz: "أَلَا يَا اسْجُدُوا", wasf: "بتخفيف اللام: «ألا» استفتاح و«يا» نداء و«اسجدوا» أمر، ويُلفظ وصلًا «أَلَا يَسْجُدُوا»"}
    - {by: "الباقون", lafz: "أَلَّا يَسْجُدُوا", wasf: "بتشديد اللام: «أنْ» الناصبة مدغمة في «لا»، و«يسجدوا» مضارع منصوب",
       dalil: "وَالْغَيْرُ أَدْرَجَ مُبْدِلاَ", ramz: "«الغير» تصريح"}
  note: "وقف الاختبار للكسائي: على «أَلَا» وعلى «يَا» ويبتدئ «اُسْجُدُوا» بضم الهمزة، أو يقف على «أَلَا يَا» (البيتان 934–935). والباقون لا يقفون على «أَنْ» لأنها غير مقطوعة في الرسم، بل على «أَلَّا» أو «يَسْجُدُوا» (البيت 936)."

