- id: 33-971b
  bayt: [517, 971, 972]
  qawl: "وَقَصْرُ كِفاً حَقٍّ يُضَاعَفْ مُثَقَّلاَ وَبِالْيَا وَفَتْحِ الْعَيْنِ رَفْعُ الْعَذَابُ حِصْنُ حُسْنٍ"
  rumuz: "ك (كفا) = ابن عامر، حق = ابن كثير وأبو عمرو (للقصر والتثقيل)؛ حصن = الكوفيون ونافع، ح (حسن) = أبو عمرو (للياء وفتح العين ورفع العذاب)"
  word: يُضَاعَفْ لَهَا الْعَذَابُ
  scope: موضع واحد
  loc: {at: [[33, 30, "يضاعف"]], span: 3}
  readings:
    - {by: "ابن كثير، ابن عامر", lafz: "نُضَعِّفْ لَهَا الْعَذَابَ", wasf: "بالنون وحذف الألف وتشديد العين مكسورة، ونصب «العذاب»",
       dalil: "وَقَصْرُ كِفاً حَقٍّ يُضَاعَفْ مُثَقَّلاَ؛ والنون وكسر العين ونصب العذاب مفهوم من خروجهما عن «حصن حسن»",
       ramz: "ك (كفا) = ابن عامر، حق = ابن كثير"}
    - {by: "أبو عمرو", lafz: "يُضَعَّفْ لَهَا الْعَذَابُ", wasf: "بالياء وحذف الألف وتشديد العين مفتوحة، ورفع «العذاب»",
       dalil: "وَقَصْرُ كِفاً حَقٍّ يُضَاعَفْ مُثَقَّلاَ وَبِالْيَا وَفَتْحِ الْعَيْنِ رَفْعُ الْعَذَابُ حِصْنُ حُسْنٍ",
       ramz: "حق (للقصر والتثقيل)، ح (حسن) = أبو عمرو (للياء والفتح والرفع)"}
    - {by: "الباقون", lafz: "يُضَاعَفْ لَهَا الْعَذَابُ", wasf: "بالياء والألف وتخفيف العين مفتوحة، ورفع «العذاب»",
       dalil: "وَبِالْيَا وَفَتْحِ الْعَيْنِ رَفْعُ الْعَذَابُ حِصْنُ حُسْنٍ؛ ومفهوم: القصر والتثقيل لمن ذُكر", ramz: "حصن = الكوفيون ونافع"}
  note: "هذا الموضع مستثنى من المسألة العامة 2-100 (البيت 517 «وَالْعَيْنُ في الْكُلِّ ثُقِّلاَ كَمَا دَارَ»)، ويوافقها تثقيل ابن كثير وابن عامر، وزاد هنا أبو عمرو."

