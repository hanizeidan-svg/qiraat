- id: 33-965a
  bayt: [965, 966]
  qawl: "وَبِالْهَمْزِ كُلُّ الَّلاءِ وَالْياَءِ بَعْدَهُ ذَكَا وَبِياَءٍ سَاكِنٍ حَجَّ هُمَّلاَ وَكَالْيَاءِ مَكْسُورًا لِوَرْشٍ وَعَنْهُمَا وَقِفْ مُسْكِناً وَالْهَمْزُ زَاكِيهِ بُجِّلاَ"
  rumuz: "ذ (ذكا) = ابن عامر والكوفيون؛ ح (حج) = أبو عمرو، ه (هملا) = البزي؛ «ورش» تصريح، و«عنهما» = أبو عمرو والبزي؛ ز (زاكيه) = قنبل، ب (بجلا) = قالون"
  word: اللَّائِي
  scope: حيث وقع (الأحزاب 4، المجادلة 2، الطلاق 4 موضعان)
  loc: {search: "^و?اللائي$"}
  readings:
    - {by: "البزي، أبو عمرو", tahwil: [["ائِي$", "ايْ"]], wasf: "بياء ساكنة بدل الهمزة بلا ياء بعدها، مع المد المشبع للساكنين",
       dalil: "وَبِياَءٍ سَاكِنٍ حَجَّ هُمَّلاَ", ramz: "ح (حج) = أبو عمرو، ه (هملا) = البزي"}
    - {by: "البزي، أبو عمرو", hal: "وصلًا", tahwil: [["ائِي$", "اءِ"]], wasf: "بتسهيل الهمزة بين بين بلا ياء (مع المد والقصر)",
       dalil: "وَكَالْيَاءِ مَكْسُورًا لِوَرْشٍ وَعَنْهُمَا", ramz: "«عنهما» = أبو عمرو والبزي"}
    - {by: "البزي، أبو عمرو", hal: "وقفًا", tahwil: [["ائِي$", "اءِ"]], wasf: "بالتسهيل مع الروم (مع المد والقصر)",
       dalil: "وَكَالْيَاءِ مَكْسُورًا لِوَرْشٍ وَعَنْهُمَا (والروم من باب الوقف بالروم والإشمام)", ramz: "«عنهما» = أبو عمرو والبزي"}
    - {by: "ورش", hal: "وصلًا", tahwil: [["ائِي$", "اءِ"]], wasf: "بتسهيل الهمزة بين بين بلا ياء (مع المد والقصر)",
       dalil: "وَكَالْيَاءِ مَكْسُورًا لِوَرْشٍ", ramz: "«ورش» تصريح"}
    - {by: "ورش", hal: "وقفًا", tahwil: [["ائِي$", "ايْ"]], wasf: "بياء ساكنة بدل الهمزة مع المد المشبع",
       dalil: "وَقِفْ مُسْكِناً", ramz: "«ورش» تصريح"}
    - {by: "ورش", hal: "وقفًا", tahwil: [["ائِي$", "اءِ"]], wasf: "بالتسهيل مع الروم (مع المد والقصر)",
       dalil: "وَكَالْيَاءِ مَكْسُورًا لِوَرْشٍ (والروم من باب الوقف بالروم والإشمام)", ramz: "«ورش» تصريح"}
    - {by: "قالون، قنبل", tahwil: [["ائِي$", "اءِ"]], wasf: "بهمزة مكسورة محققة بلا ياء (ويقفان بإسكانها)",
       dalil: "وَالْهَمْزُ زَاكِيهِ بُجِّلاَ", ramz: "ز (زاكيه) = قنبل، ب (بجلا) = قالون"}
    - {by: "الباقون", wasf: "بهمزة مكسورة بعدها ياء ساكنة",
       dalil: "وَبِالْهَمْزِ كُلُّ الَّلاءِ وَالْياَءِ بَعْدَهُ ذَكَا", ramz: "ذ (ذكا) = ابن عامر والكوفيون"}
  note: "ولحمزة وقفًا تسهيل الهمزة بين بين مع المد والقصر على أصله. ولأبي عمرو والبزي في وجه التسهيل وقفًا ما لورش (الإبدال، أو التسهيل مع الروم). على ترتيب الوافي (ص342): للبزي وأبي عمرو وصلًا الإبدال ياءً ساكنة مع الإشباع ثم التسهيل مع المد والقصر، ووقفًا ثلاثة أوجه: الإبدال مع الإشباع، ثم التسهيل بالروم مع المد والقصر؛ ولورش وصلًا التسهيل مع المد والقصر، ووقفًا الأوجه الثلاثة نفسها بهذا الترتيب."

