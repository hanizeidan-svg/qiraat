       wasf: "بالياء مضمومة في الفعلين (مبنيين للمفعول) ورفع «أحسن»"}
    - {by: "الباقون", lafz: "نَتَقَبَّلُ عَنْهُمْ أَحْسَنَ ... وَنَتَجَاوَزُ", wasf: "بالنون مفتوحة في الفعلين ونصب «أحسن»",
