- id: 46-1034a
  bayt: [1034]
  qawl: "وَغَيْرُ صِحَابٍ أَحْسَنَ ارْفَعْ وَقَبْلَهُ وَبَعْدُ بِياَءٍ ضُمَّ فِعْلاَنِ وُصِّلاَ"
  rumuz: "«غير صحاب» = غير حمزة والكسائي وحفص"
  word: نَتَقَبَّلُ عَنْهُمْ أَحْسَنَ مَا عَمِلُوا وَنَتَجَاوَزُ
  scope: موضع واحد
  loc: {at: [[46, 16, "نتقبل"]]}
