# أصول سورة الكهف من «البدور الزاهرة» (ص190–198): الممال والمدغم لكل ربع، وياءات الإضافة والزوائد.
# الربع 117 يبدأ من الإسراء 99، فما وقع في الإسراء 99–111 من قوائمه (ص190) سُجّل هنا بمعرّفات u17-*9xx.
# فواتح السور و«رأى» ونحوها في ملفات الفرش (010، 006)، فلم تُكرَّر.

# ───────────── الإمالة ─────────────
