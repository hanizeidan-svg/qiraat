- id: u4-h001
  bayt: [158, 160, 163]
  qawl: "وَسَكِّنْ يُؤَدِّهْ مَعْ نُوَلِّهْ وَنُصْلِهِ وَنُؤْتِهِ مِنْهَا فَاعَتَبِرْ صَافِياً حَلاَ ... وَفي الْكُلِّ قَصْرُ الْهَاءِ بَانَ لِسَانُهُ ... بخُلْفٍ"
  word: "نُوَلِّهِ، وَنُصْلِهِ"
  scope: "مواضع معينة"
  loc: {at: [[4, 115, "نوله"], [4, 115, "ونصله"]]}
  readings:
    - {by: "أبو عمرو، شعبة، حمزة", tahwil: [['هِ$', 'هْ']], wasf: "بإسكان الهاء", dalil: "وَسَكِّنْ يُؤَدِّهْ مَعْ نُوَلِّهْ وَنُصْلِهِ وَنُؤْتِهِ مِنْهَا فَاعَتَبِرْ صَافِياً حَلاَ", ramz: "ف (فاعتبر) = حمزة، ص (صافيا) = شعبة، ح (حلا) = أبو عمرو"}
    - {by: "قالون، هشام", hal: "وصلًا", wasf: "بكسر الهاء من غير صلة (القصر)", dalil: "وَفي الْكُلِّ قَصْرُ الْهَاءِ بَانَ لِسَانُهُ بخُلْفٍ", ramz: "ب (بان) = قالون، ل (لسانه) = هشام بخلف"}
    - {by: "هشام", hal: "وصلًا", tahwil: [['هِ$', 'هِي']], wasf: "بكسر الهاء مع الصلة", dalil: "بخُلْفٍ (الوجه الثاني لهشام)", ramz: "ل = هشام"}
    - {by: "الباقون", hal: "وصلًا", tahwil: [['هِ$', 'هِي']], wasf: "بكسر الهاء مع الصلة", dalil: "وَمَا قَبْلَهُ التَّحْرِيكُ لِلْكُلِّ وُصِّلاَ (الأصل)", ramz: "—"}
    - {by: "الباقون", hal: "وقفًا", tahwil: [['هِ$', 'هْ']], wasf: "بإسكان الهاء", dalil: "الوقف بالسكون", ramz: "—"}
  note: "لهشام القصر والصلة، والقصر مقدَّم في ذكر البدور. ومن قرأ بالقصر أو الصلة يقف بالسكون."
  marji:
