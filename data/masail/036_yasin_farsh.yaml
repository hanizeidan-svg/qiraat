- id: 46-992b
  bayt: [992]
  qawl: "وَالاَحْقَافُ هُمْ بِهَا بِخُلْفٍ هَدَى"
  rumuz: "«هم» = أصحاب «دم غصنا» (ابن كثير والكوفيون وأبو عمرو)، ه (هدى) = البزي بخلفه"
  word: لِيُنْذِرَ الَّذِينَ ظَلَمُوا
  scope: موضع واحد (الأحقاف)
  loc: {at: [[46, 12, "لينذر"]]}
  readings:
    - {by: "قنبل، أبو عمرو، عاصم، حمزة، الكسائي", wasf: "بالياء (غيبة)", ramz: "«هم» = د غ"}
    - {by: "الباقون", lafz: "لِتُنْذِرَ", wasf: "بالتاء (خطابًا)", dalil: "مفهوم: الغيب لمن ذُكر", ramz: "—"}
  note: "مفاد النظم للبزي الخلف (الغيب والخطاب)، لكن الوافي ص350: «الصحيح أن البزي ليس له في الأحقاف إلا التاء»؛ فحُذف وجه الغيب له، فهو مع الباقين بالخطاب."
  marji:
    - {kitab: "الوافي", safha: "350", mawdu: "مفاد النظم للبزي الخلف (الغيب والخطاب)، لكن الوافي ص350: «الصحيح أن البزي ليس له في الأحقاف إلا التاء»"}
  tahrir:
    - {naw: "خروج عن الطريق", rawi: "البزي", bayan: "ذكر الناظم للبزي خلفًا في «لينذر» في الأحقاف (بخلف هدى)", hukm: "لا يقرأ به؛ ليس للبزي في الأحقاف إلا التاء", qawl: "الصحيح أن البزي ليس له في الأحقاف إلا التاء", kitab: "الوافي", safha: "350"}
