- id: 36-988a
  bayt: [988]
  qawl: "وَخَا يَخْصِمُونَ افْتَحْ سَمَا لُذْ وَأَخْفِ حُلْوَ بَرٍّ وَسَكِّنْهُ وَخَفِّفْ فَتُكْمِلاَ"
  rumuz: "سما = نافع وابن كثير وأبو عمرو، ل (لذ) = هشام؛ ح (حلو) = أبو عمرو، ب (بر) = قالون؛ ف (فتكملا) = حمزة"
  word: يَخِصِّمُونَ
  scope: موضع واحد
  loc: {at: [[36, 49, "يخصمون"]]}
  readings:
    - {by: "ورش، ابن كثير، هشام", lafz: "يَخَصِّمُونَ", wasf: "بفتح الخاء وتشديد الصاد",
       dalil: "وَخَا يَخْصِمُونَ افْتَحْ سَمَا لُذْ", ramz: "سما = نافع وابن كثير وأبو عمرو، ل (لذ) = هشام"}
    - {by: "قالون، أبو عمرو", lafz: "يَخَصِّمُونَ", wasf: "باختلاس فتحة الخاء مع تشديد الصاد",
       dalil: "وَأَخْفِ حُلْوَ بَرٍّ", ramz: "ح (حلو) = أبو عمرو، ب (بر) = قالون"}
    - {by: "قالون", ziyada: true, lafz: "يَخْصِّمُونَ", wasf: "بإسكان الخاء مع تشديد الصاد",
       dalil: "وَأَخْفِ حُلْوَ بَرٍّ (والإسكان لقالون زيادة على النظم، صحّحها الوافي)", ramz: "ب (بر) = قالون"}
    - {by: "حمزة", lafz: "يَخْصِمُونَ", wasf: "بإسكان الخاء وتخفيف الصاد",
       dalil: "وَسَكِّنْهُ وَخَفِّفْ فَتُكْمِلاَ", ramz: "ف (فتكملا) = حمزة"}
    - {by: "الباقون", wasf: "بكسر الخاء وتشديد الصاد", dalil: "مفهوم: الباقون على لفظ التلاوة", ramz: "—"}
  note: "على ترتيب الوافي (ص349): لقالون وجهان: اختلاس فتحة الخاء ثم إسكانها، كلاهما مع تشديد الصاد؛ والإسكان «وجه صحيح مقروء به له» وليس من مفاد النظم. ولم يذكر الإسكان لأبي عمرو، فليس له إلا الاختلاس."
  marji:
    - {kitab: "الوافي", safha: "349", mawdu: "على ترتيب الوافي (ص349): لقالون وجهان: اختلاس فتحة الخاء ثم إسكانها، كلاهما مع تشديد الصاد"}
  tahrir:
    - {naw: "زيادة على النظم", rawi: "قالون", bayan: "لم يذكر الناظم لقالون إلا اختلاس فتحة الخاء (وأخف حلو بر)، وورد عنه أيضًا إسكانها مع تشديد الصاد", hukm: "مقروء به؛ لقالون الاختلاس ثم الإسكان، ولأبي عمرو الاختلاس وحده", qawl: "ورد عن قالون أيضا سكون الخاء وهو وجه صحيح مقروء به له", kitab: "الوافي", safha: "349"}

