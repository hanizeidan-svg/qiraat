- id: u56-m001
  bayt: [339, 340, 341]
  qawl: "وَفِي هَاءِ تَأْنِيثِ الْوُقُوفِ وَقَبْلَهَا مُمَالُ الْكِسَائِي غَيْرَ عَشْرٍ لِيَعْدِلاَ"
  word: كَاذِبَةٌ، ثُلَّةٌ، وَثُلَّةٌ، الْمَيْمَنَةِ، الْمَشْأَمَةِ، مَوْضُونَةٍ، كَثِيرَةٍ
  scope: "الربع 214"
  loc: {"at": [[56, 2, "كاذبة"], [56, 13, "و?ثلة"], [56, 39, "و?ثلة"], [56, 40, "و?ثلة"], [56, 8, "ال?ميمنة"], [56, 9, "ال?مشأمة"], [56, 15, "موضونة"], [56, 32, "كثيرة"]]}
  imala: {"kubra": "الكسائي", "hal": "وقفًا"}
  note: "إمالة هاء التأنيث وما قبلها للكسائي وقفًا."
  review: "ذكر البدور «وثلة» ولم يقيّد؛ أُدرجت المواضع الثلاثة (13، 39، 40). ولم يذكر غير هذه الكلمات من هاءات الربع (كالفاكهة والثلاثة والتذكرة)."
  marji:
