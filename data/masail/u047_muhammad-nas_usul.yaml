- id: u56-m002
  bayt: [339, 340, 342]
  qawl: "غَيْرَ عَشْرٍ لِيَعْدِلاَ وَيَجْمَعُهَا حَقٌ ضِغَاطُ عَصٍ خَظَا ... وَبَعْضُهُمْ سِوى أَلِفٍ عِنْدَ الْكِسَائيِّ مَيَّلاَ"
