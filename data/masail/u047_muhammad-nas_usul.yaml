# أصول من «البدور الزاهرة» (عبد الفتاح القاضي): من سورة محمد إلى سورة الناس (البدور ص297–349)
# الأبواب الستة: الإمالة، الإدغام الكبير، الإدغام الصغير، ياءات الإضافة، الزوائد، هاءات الكناية الخاصة.
# المعرّف u{سورة الموضع الأول}-{m|k|s|y|z|h}{nnn}. «الربع N» = رقم ربع الحزب في المصحف.
# لا يُكرَّر هنا ما في ملفات الفرش: «أدراك» (10-740a)، «رأى/رآه» (6-646a، 21-647a)، «التوراة» (3-546a)،
#   إدغام «والذاريات ذروا» (51-993b) و«فالملقيات ذكرا، فالمغيرات صبحا» (77-994a).

# ───────────── سورة محمد ─────────────

