- id: 35-984a
  bayt: [984]
  qawl: "وَنَجْزِي بِياَءٍ ضُمَّ مَعْ فَتْحِ زَايِهِ وَكُلَّ بِهِ ارْفَعْ وَهْوَ عَنْ وَلَدِ الْعَلاَ"
  rumuz: "«ولد العلا» تصريح = أبو عمرو"
  word: كَذَلِكَ نَجْزِي كُلَّ كَفُورٍ
  scope: موضع واحد
  loc: {at: [[35, 36, "نجزي"]]}
  readings:
    - {by: "أبو عمرو", lafz: "يُجْزَى كُلُّ كَفُورٍ", wasf: "بالياء مضمومة وفتح الزاي (مبنيًّا للمفعول) ورفع «كل»"}
    - {by: "الباقون", lafz: "نَجْزِي كُلَّ كَفُورٍ", wasf: "بالنون مفتوحة وكسر الزاي ونصب «كل»",
       dalil: "مفهوم: ضد ما قُيِّد", ramz: "—"}

- id: 35-985a
  bayt: [985]
  qawl: "وَفِي السَّيِّئِ المَخْفُوضِ هَمْزًا سُكُونُهُ فَشاَ"
  rumuz: "ف (فشا) = حمزة"
  word: وَمَكْرَ السَّيِّئِ
  scope: موضع واحد (الأول المخفوض)
  loc: {at: [[35, 43, "السيئ", 1]]}
  readings:
    - {by: "حمزة", hal: "وصلًا", lafz: "السَّيِّئْ", wasf: "بإسكان الهمزة"}
    - {by: "حمزة", hal: "وقفًا", wasf: "على أصله في الوقف على الهمز المتطرف",
       dalil: "باب وقف حمزة وهشام على الهمز", ramz: "—"}
    - {by: "الباقون", wasf: "بكسر الهمزة وصلًا", dalil: "مفهوم: الإسكان لمن ذُكر", ramz: "—"}
  note: "الثاني «وَلَا يَحِيقُ الْمَكْرُ السَّيِّئُ» مرفوع، وهو بالضم للجميع. ولهشام في الوقف أصله في الهمز المتطرف."

- id: 35-985b
  bayt: [985]
  qawl: "بَيِّناتٍ قَصْرُ حَقٍّ فَتًى عَلاَ"
  rumuz: "حق = ابن كثير وأبو عمرو، ف (فتى) = حمزة، ع (علا) = حفص"
  word: فَهُمْ عَلَى بَيِّنَتٍ مِنْهُ
  scope: موضع واحد
  loc: {at: [[35, 40, "بينت"]]}
  readings:
    - {by: "ابن كثير، أبو عمرو، حفص، حمزة", wasf: "بالإفراد (بلا ألف)"}
    - {by: "الباقون", lafz: "بَيِّنَاتٍ", wasf: "بالجمع (بالألف)", dalil: "مفهوم: لفظ الترجمة «بَيِّناتٍ»", ramz: "—"}
  note: "رُسمت بالتاء؛ والوقف عليها لمن أفرد على أصله في باب الوقف على مرسوم الخط."
