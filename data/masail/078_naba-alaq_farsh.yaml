  qawl: "مُصَيْطِرٌ اشْمِمْ ضَاعَ وَالْخُلْفُ قُلِّلاَ وَبِالسِّينِ لُذْ"
  rumuz: "ض (ضاع) = خلف، ق (قللا) = خلاد بالخلف، ل (لذ) = هشام"
  word: لَسْتَ عَلَيْهِمْ بِمُصَيْطِرٍ
  scope: موضع واحد (الغاشية 22)
  loc: {at: [[88, 22, "بمصيطر"]]}
  readings:
    - {by: "خلف", wasf: "بإشمام الصاد صوت الزاي", dalil: "مُصَيْطِرٌ اشْمِمْ ضَاعَ", ramz: "ض (ضاع) = خلف"}
    - {by: "خلاد", wasf: "بإشمام الصاد صوت الزاي", dalil: "وَالْخُلْفُ قُلِّلاَ", ramz: "ق (قللا) = خلاد بالخلف"}
    - {by: "خلاد", wasf: "بالصاد الخالصة", dalil: "وَالْخُلْفُ قُلِّلاَ", ramz: "ق (قللا) = خلاد بالخلف"}
    - {by: "هشام", tahwil: [["صَ", "سَ"]], wasf: "بالسين", dalil: "وَبِالسِّينِ لُذْ", ramz: "ل (لذ) = هشام"}
    - {by: "الباقون", wasf: "بالصاد الخالصة", dalil: "مفهوم: الرسم بالصاد", ramz: "—"}
  note: "الوافي ص 379: الإشمام لخلف وخلاد بخلف عنه، والصاد الخالصة «هو الوجه الثاني لخلاد»؛ فالإشمام مقدَّم، على ترتيب الوافي."
  marji:
    - {kitab: "الوافي", safha: "379", mawdu: "الوافي ص 379: الإشمام لخلف وخلاد بخلف عنه، والصاد الخالصة «هو الوجه الثاني لخلاد»"}

