# ───────────── الإدغام الكبير ─────────────
- id: u16-k001
  bayt: [116, 118, 119, 139, 140, 146, 150, 151]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ"
  word: "وَسَخَّرَ لَكُمُ، وَالنُّجُومُ مُسَخَّرَاتٌ، يَخْلُقُ كَمَنْ، يَعْلَمُ مَا (معًا)، قِيلَ لَهُمْ، أَنْزَلَ رَبُّكُمْ، الْمَلَائِكَةُ ظَالِمِي، السَّلَمَ مَا"
  scope: "الربع 107 (النحل 1–29)"
  loc: {at: [[16, 12, "وسخر"], [16, 12, "والنجوم"], [16, 17, "يخلق", 1], [16, 19, "يعلم"], [16, 23, "يعلم"], [16, 24, "قيل"], [16, 24, "أنزل"], [16, 28, "الملائكة"], [16, 28, "السلم"]], span: 2}
  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار (انظر 2-k01). ولا إدغام في «وَالْحَمِيرَ لِتَرْكَبُوهَا» (8) ولا «الْبَحْرَ لِتَأْكُلُوا» (14) لفتح الراء بعد ساكن."
  marji:
    - {kitab: "البدور الزاهرة", safha: "179", mawdu: "المدغم الكبير في الربع (النحل 1–29)"}

- id: u16-k002
  bayt: [116, 118, 119, 146, 150, 151]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ"
