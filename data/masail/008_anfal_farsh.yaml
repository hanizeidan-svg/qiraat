- id: 8-714a
  bayt: [714]
  qawl: "وَفِي مُرْدِفِينَ الدَّالَ يَفْتَحُ نَافِعٌ وَعَنْ قُنْبُلٍ يُرْوَى وَلَيْسَ مُعَوَّلاَ"
  rumuz: "«نافع» تصريح"
  word: مِنَ الْمَلَائِكَةِ مُرْدِفِينَ
  scope: موضع واحد
  loc: {at: [[8, 9, "مردفين"]]}
  readings:
    - {by: "نافع", lafz: "مُرْدَفِينَ", wasf: "بفتح الدال", dalil: "وَفِي مُرْدِفِينَ الدَّالَ يَفْتَحُ نَافِعٌ", ramz: "«نافع» تصريح"}
    - {by: "الباقون", lafz: "مُرْدِفِينَ", wasf: "بكسر الدال", dalil: "مفهوم: الفتح لنافع؛ وَعَنْ قُنْبُلٍ يُرْوَى وَلَيْسَ مُعَوَّلاَ", ramz: "—"}
  note: "رُوي الفتح عن قنبل وليس معوَّلًا عليه، فقنبل بالكسر."
  marji:
    - {kitab: "الوافي", safha: "278", mawdu: "لقنبل وجهان، والفتح لم يصح من طريق الناظم وأصله، فيُقتصر له على الكسر"}
  tahrir:
    - {naw: "خروج عن الطريق", rawi: "قنبل", bayan: "ذكر الناظم رواية فتح الدال عن قنبل (وعن قنبل يروى وليس معوّلا)", hukm: "لا يقرأ به؛ ليس لقنبل إلا الكسر كالجماعة", qawl: "لم يعتمد عليه ولم يصح من طريق الناظم وأصله", kitab: "الوافي", safha: "278"}

- id: 8-715a
  bayt: [715]
  qawl: "وَيُغْشِي سَمَا خِفًّا وَفِي ضَمِّهِ افْتَحُوا وَفِي الْكَسْرِ حَقًّا وَالنُّعَاسَ ارْفَعُوا وِلاَ"
  rumuz: "سما = نافع وابن كثير وأبو عمرو، حق = ابن كثير وأبو عمرو"
  word: إِذْ يُغَشِّيكُمُ النُّعَاسَ
  scope: موضع واحد
  loc: {at: [[8, 11, "يغشيكم"]], span: 2}
  readings:
    - {by: "ابن كثير، أبو عمرو", lafz: "يَغْشَاكُمُ النُّعَاسُ", wasf: "بفتح الياء والشين مخففة وألف بعدها، ورفع «النعاس»",
       dalil: "وَيُغْشِي سَمَا خِفًّا وَفِي ضَمِّهِ افْتَحُوا وَفِي الْكَسْرِ حَقًّا وَالنُّعَاسَ ارْفَعُوا وِلاَ", ramz: "سما للتخفيف، حق للفتح والرفع"}
    - {by: "نافع", lafz: "يُغْشِيكُمُ النُّعَاسَ", wasf: "بضم الياء وإسكان الغين وتخفيف الشين، ونصب «النعاس»",
       dalil: "وَيُغْشِي سَمَا خِفًّا", ramz: "سما = نافع وابن كثير وأبو عمرو (وانفرد حق بما بعده)"}
    - {by: "الباقون", lafz: "يُغَشِّيكُمُ النُّعَاسَ", wasf: "بضم الياء وفتح الغين وتشديد الشين، ونصب «النعاس»", dalil: "مفهوم: ضد التخفيف", ramz: "—"}

- id: 8-716a
  bayt: [716]
  qawl: "وَتَخْفِيفُهُمْ فِي الأَوَّلَينَ هُنَا وَلـكِنِ اللهُ وَارْفَعْ هَاءهُ شَاعَ كُفَّلاَ"
  rumuz: "ش (شاع) = حمزة والكسائي، ك (كفلا) = ابن عامر"
  word: وَلَكِنَّ اللَّهَ قَتَلَهُمْ / وَلَكِنَّ اللَّهَ رَمَى
  scope: موضعان (الأنفال 17)
  loc: {at: [[8, 17, "ولكن"]], span: 2}
  readings:
    - {by: "ابن عامر، حمزة، الكسائي", tahwil: [["كِنَّ اللَّهَ", "كِنِ اللَّهُ"]], wasf: "بتخفيف النون مكسورة وصلًا ورفع لفظ الجلالة"}
    - {by: "الباقون", wasf: "بتشديد النون ونصب لفظ الجلالة", dalil: "مفهوم: ضد التخفيف والرفع", ramz: "—"}
  note: "«في الأولين» احتراز من الثالث «وَلَكِنَّ اللَّهَ سَلَّمَ» (الأنفال 43) فهو بالتشديد للجميع."

