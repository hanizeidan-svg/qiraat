    - {by: "الباقون", lafz: "مُوَهِّنٌ كَيْدَ", wasf: "بفتح الواو وتشديد الهاء مع التنوين ونصب «كيد»", dalil: "مفهوم: ضد التخفيف", ramz: "—"}

