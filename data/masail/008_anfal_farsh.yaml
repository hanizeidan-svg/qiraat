    - {by: "حفص", lafz: "مُوهِنُ كَيْدِ", wasf: "بالتخفيف بلا تنوين وخفض «كيد»",
       dalil: "وَفِيهِ لَمْ يُنَوَّنْ لِحَفْصٍ كَيْدَ بِالْخَفْضِ عَوَّلاَ", ramz: "«حفص» تصريح، ومعه ذ (ذاع) للتخفيف"}
