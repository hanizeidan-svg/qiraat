- id: 31-962a
  bayt: [962]
  qawl: "وَفِي نِعْمَةً حَرِّكْ وَذُكِّرَ هَاؤُهَا وَضُمَّ وَلاَ تَنْوِينَ عَنْ حُسْنٍ اعْتَلاَ"
  rumuz: "ع (عن) = حفص، ح (حسن) = أبو عمرو، أ (اعتلا) = نافع"
  word: وَأَسْبَغَ عَلَيْكُمْ نِعَمَهُ
  scope: موضع واحد
  loc: {at: [[31, 20, "نعمه"]]}
  readings:
    - {by: "نافع، أبو عمرو، حفص", lafz: "نِعَمَهُ", wasf: "بفتح العين وهاء ضمير مضمومة بلا تنوين (جمع)"}
    - {by: "الباقون", lafz: "نِعْمَةً", wasf: "بإسكان العين وتاء تأنيث منونة (إفراد)", dalil: "مفهوم: لفظ الترجمة «نِعْمَةً»", ramz: "—"}

