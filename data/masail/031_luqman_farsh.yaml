- id: 31-961a
  bayt: [961]
  qawl: "وَيَتَّخِذَ المَرْفُوعُ غَيْرُ صِحَابِهِمْ"
  rumuz: "«غير صحاب» تصريح؛ صحاب = حمزة والكسائي وحفص"
