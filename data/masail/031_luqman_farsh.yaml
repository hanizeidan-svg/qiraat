- id: 31-961b
  bayt: [961]
  qawl: "تُصَعِّرْ بِمدٍّ خَفَّ إِذْ شَرْعُهُ حَلاَ"
  rumuz: "أ (إذ) = نافع، ش (شرعه) = حمزة والكسائي، ح (حلا) = أبو عمرو"
  word: وَلَا تُصَعِّرْ خَدَّكَ
