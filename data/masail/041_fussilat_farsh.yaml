- id: 41-1015a
  bayt: [1015]
  qawl: "وَإِسْكَانُ نَحْسَاتٍ بِهِ كَسْرُهُ ذَكَا"
  rumuz: "ذ (ذكا) = ابن عامر والكوفيون"
  word: فِي أَيَّامٍ نَحِسَاتٍ
  scope: موضع واحد
  loc: {at: [[41, 16, "نحسات"]]}
  readings:
    - {by: "ابن عامر، عاصم، حمزة، الكسائي", wasf: "بكسر الحاء"}
    - {by: "الباقون", tahwil: [["نَحِسَات", "نَحْسَات"]], wasf: "بإسكان الحاء", dalil: "وَإِسْكَانُ نَحْسَاتٍ (لفظ الترجمة)", ramz: "—"}
  note: "وقوله «وَقَوْلُ مُمِيلِ السِّينِ لِلَّيْثِ أُخْمِلاَ»: ما رُوي عن أبي الحارث من إمالة ألف «نحسات» قول خامل لا يُقرأ به، فهي بالفتح للجميع."
  marji:
    - {kitab: "الوافي", safha: "355", mawdu: "إمالة السين لأبي الحارث قول مخمل متروك لا يقرأ به"}
  tahrir:
    - {naw: "وجه ضعيف", rawi: "أبو الحارث", bayan: "ذكر الناظم نقلَ إمالة ألف «نحسات» عن أبي الحارث (وقول مميل السين لليث أخملا)", hukm: "لا يقرأ به؛ الفتح للجميع", qawl: "قول مخمل متروك لم يصح عن الليث فلا يقرأ به", kitab: "الوافي", safha: "355"}
  iqrar:
    - {man: "هاني زيدان", tarikh: "2026-10-04", mawdu: "لا يُقرأ لأبي الحارث بإمالة «نحسات»؛ والحاء مكسورة لابن عامر والكوفيين، ساكنة لنافع وابن كثير وأبي عمرو"}

