  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ"
  word: "يَعْلَمُ مَا، بِالنَّهَارِ لَهُ، فَيُصِيبُ بِهَا، الْمِحَالِ لَهُ، خَالِقُ كُلِّ، الْأَمْثَالَ لِلَّذِينَ"
