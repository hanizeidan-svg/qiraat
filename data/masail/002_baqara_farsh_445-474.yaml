  word: يَكْذِبُونَ
  scope: موضع واحد
  loc: {at: [[2, 10]], token: "يكذبون"}
  readings:
    - {by: "عاصم، حمزة، الكسائي", lafz: "يَكْذِبُونَ", wasf: "بفتح الياء وتخفيف الذال",
       dalil: "وَخَفَّفَ كُوفٍ يَكْذِبُونَ وَيَاؤُهُ بِفَتْحٍ", ramz: "«كوف» تصريح = الكوفيون"}
    - {by: "الباقون", lafz: "يُكَذِّبُونَ", wasf: "بضم الياء وتشديد الذال",
       dalil: "وَلِلْبَاقِينَ ضُمَّ وَثُقِّلاَ", ramz: "«الباقين» تصريح"}

