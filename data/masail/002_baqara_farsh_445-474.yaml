# فرش سورة البقرة — الأبيات 445–474
#
# حقول المسألة:
#   id, bayt: [أرقام الأبيات], qawl: موضع الشاهد, rumuz: فك الرموز (عام للمسألة)
#   word: الكلمة برواية حفص, scope: موضع واحد | حيث وقع | مواضع معينة
#   loc: تحديد المواضع (انظر scripts/build_masail.py)
#   readings: لكل قراءة:
#     by:     القراء/الرواة، أو «الباقون»
#     lafz:   اللفظ مكتوبًا (للموضع الواحد)، أو
#     tahwil: [[نمط, بديل], ...] تُطبَّق على كلمة حفص في كل موضع لتوليد لفظ الراوي
#             (إذا غاب lafz وtahwil فاللفظ كلفظ حفص، والفرق في wasf)
#     wasf:   وصف الأداء      hal: وصلًا | وقفًا | وصلًا ووقفًا (الافتراضي)
#     dalil:  نص الدليل من النظم لهذه القراءة (الافتراضي: qawl)
#     ramz:   الرمز الدال على أصحابها (الافتراضي: rumuz)
#   ترتيب القراءات للراوي الواحد = ترتيب الأوجه (الأول مقدَّم).

- id: 2-001
  bayt: [445]
  qawl: "وَمَا يَخْدَعُونَ الْفَتْحُ مِنْ قَبْلِ سَاكِنٍ وَبَعْدُ ذَكَا وَالْغَيْرُ كَالْحَرْفِ أَوَّلاَ"
  word: يَخْدَعُونَ
  scope: موضع واحد
  loc: {at: [[2, 9]], token: "يخدعون"}
  readings:
    - {by: "ابن عامر، عاصم، حمزة، الكسائي", lafz: "يَخْدَعُونَ", wasf: "بفتح الياء والدال وإسكان الخاء بلا ألف",
       dalil: "وَمَا يَخْدَعُونَ الْفَتْحُ مِنْ قَبْلِ سَاكِنٍ وَبَعْدُ ذَكَا", ramz: "ذ (ذكا) = ابن عامر والكوفيون"}
    - {by: "الباقون", lafz: "يُخَادِعُونَ", wasf: "بضم الياء وألف بعد الخاء وكسر الدال",
       dalil: "وَالْغَيْرُ كَالْحَرْفِ أَوَّلاَ", ramz: "«الغير» تصريح"}
  note: "الموضع الأول «يُخَادِعُونَ اللَّهَ» متفق عليه."

