- id: 2-018
  bayt: [454, 455]
  qawl: "وَإِسْكَانُ بَارِئِكُمْ وَيَأْمُرُكُمْ لَهُ وَيَأْمُرُهُمْ أَيْضًا وَتَأْمُرُهُمْ تَلاَ وَيَنْصُرُكُمْ أَيْضًا وَيُشْعِرُكُمْ وَكَمْ جَلِيلٍ عَنِ الدُّورِيِّ مُخْتَلِسًا جَلاَ"
  word: بَارِئِكُمْ، يَأْمُرُكُمْ، يَأْمُرُهُمْ، تَأْمُرُهُمْ، يَنْصُرُكُمْ، يُشْعِرُكُمْ
  scope: حيث وقع
  loc: {search: "^[وف]?(بارئكم|أ?يأمركم|يأمرهم|تأمرهم|ينصركم|يشعركم)$", uthmani_not: "رْ", exclude: [[3, 80, 1]]}
  readings:
    - {by: "أبو عمرو", tahwil: [["([ئر])[\u064E\u064F\u0650](?=[كه])", "\\1\u0652"]], wasf: "بإسكان الهمزة/الراء",
       dalil: "وَإِسْكَانُ بَارِئِكُمْ وَيَأْمُرُكُمْ لَهُ ...", ramz: "«له» الضمير لأبي عمرو (ح في «حلا» من البيت 453)"}
    - {by: "دوري أبي عمرو", wasf: "باختلاس الحركة",
       dalil: "وَكَمْ جَلِيلٍ عَنِ الدُّورِيِّ مُخْتَلِسًا جَلاَ", ramz: "«الدوري» تصريح"}
    - {by: "الباقون", wasf: "بإتمام الحركة", dalil: "مفهوم: الباقون على الأصل", ramz: "—"}
  note: "للدوري وجهان: الإسكان (مقدَّم) والاختلاس، وللسوسي الإسكان وحده. يخرج المجزوم (إن ينصرْكم) فهو ساكن للجميع. وفي «يأمركم» (آل عمران 80) خلاف آخر في الرفع والنصب يأتي في فرشها."

