- id: 2-041
  bayt: [470]
  qawl: "وَخُفِّفَ عَنْهُمْ يُنْزِلُ الْغَيْثَ مُسْجَلاَ"
  rumuz: "«عنهم» = حق شفا (ابن كثير وأبو عمرو وحمزة والكسائي)"
  word: وَيُنَزِّلُ الْغَيْثَ
  scope: مواضع معينة
  loc: {at: [[31, 34], [42, 28]], token: "و?ينزل"}
  readings:
    - {by: "ابن كثير، أبو عمرو، حمزة، الكسائي", tahwil: [["نَزّ", "نْز"]], wasf: "بالتخفيف"}
    - {by: "الباقون", wasf: "بالتشديد", dalil: "مفهوم: ضد التخفيف", ramz: "—"}

- id: 2-042
  bayt: [471, 472]
  qawl: "وَجِبْرِيلَ فَتْحُ الْجِيمِ وَالرَّا وَبَعْدَهَا وَعى هَمْزَةً مَكْسُورَةً صُحْبَةٌ وِلاَ بِحَيْثُ أَتَى وَالْيَاءَ يَحْذِفُ شُعْبَةٌ وَمَكِّيُّهُمْ في الْجِيمِ بالْفَتْحِ وُكِّلاَ"
  word: جِبْرِيلَ
  scope: حيث وقع
  loc: {search: "^[وفل]?جبريل$"}
  readings:
    - {by: "حمزة، الكسائي", tahwil: [["جِبْرِيل", "جَبْرَئِيل"]], wasf: "بفتح الجيم والراء وهمزة مكسورة بعدها ياء",
       dalil: "وَجِبْرِيلَ فَتْحُ الْجِيمِ وَالرَّا وَبَعْدَهَا وَعى هَمْزَةً مَكْسُورَةً صُحْبَةٌ", ramz: "صحبة = حمزة والكسائي وشعبة"}
    - {by: "شعبة", tahwil: [["جِبْرِيل", "جَبْرَئِل"]], wasf: "كذلك بحذف الياء",
       dalil: "وَالْيَاءَ يَحْذِفُ شُعْبَةٌ", ramz: "صحبة + «شعبة» تصريح"}
    - {by: "ابن كثير", tahwil: [["جِبْرِيل", "جَبْرِيل"]], wasf: "بفتح الجيم",
       dalil: "وَمَكِّيُّهُمْ في الْجِيمِ بالْفَتْحِ وُكِّلاَ", ramz: "«مكيهم» تصريح = ابن كثير"}
    - {by: "الباقون", wasf: "بكسر الجيم والراء بلا همز", dalil: "مفهوم: الباقون على لفظ التلاوة", ramz: "—"}

