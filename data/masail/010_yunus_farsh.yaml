       dalil: "وَأَخْفَى بَنُو حَمْدٍ", ramz: "ب (بنو) = قالون، ح (حمد) = أبو عمرو"}
    - {by: "الباقون", lafz: "يَهَدِّي", wasf: "بفتح الياء والهاء (فتحًا كاملًا) وتشديد الدال", dalil: "مفهوم: لفظ الترجمة «يَهَدِّي»", ramz: "—"}
