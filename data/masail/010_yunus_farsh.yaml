    - {by: "الباقون", wasf: "بالفتح", dalil: "مفهوم: الإمالة لمن ذُكر", ramz: "—"}
  note: "لا يدخل «يُدْرِيكَ». وإمالة أبي عمرو وحمزة والكسائي فيه داخلة أيضًا في أصلهم في ذوات الراء. الوافي ص285: «البصري» مع المذكورين قبل (ابن ذكوان وصحبة) أمالوا «أدرى» حيث ورد، واختُلف عن ابن ذكوان، ووجهاه على ترتيب الوافي: «الفتح والإمالة»؛ وتقليل ورش فيه بنص «وذو الرا لورش»."
