- id: 19-739a
  bayt: [739, 741]
  qawl: "وَكَمْ صُحْبَةٍ يَا كَافَ والْخُلْفُ يَاسِرٌ ... وَناَفِعٌ لَدى مَرْيَمٍ هَا يَا"
  rumuz: "ك (كم) = ابن عامر، صحبة = شعبة وحمزة والكسائي، ي (ياسر) = السوسي بخلف؛ «نافع» تصريح"
  word: الياء من «كهيعص»
  scope: موضع واحد
  loc: {search: "^كهيعص$"}
  readings:
    - {by: "ابن عامر، شعبة، حمزة، الكسائي", wasf: "بإمالة الياء إمالة كبرى", dalil: "وَكَمْ صُحْبَةٍ يَا كَافَ", ramz: "ك (كم) = ابن عامر، صحبة"}
    - {by: "ورش", wasf: "بتقليل الياء (بين بين)", dalil: "وَناَفِعٌ لَدى مَرْيَمٍ هَا يَا", ramz: "«نافع» تصريح (المعمول به لورش وحده)"}
    - {by: "الباقون", wasf: "بفتح الياء", dalil: "مفهوم: الإمالة والتقليل لمن ذُكر", ramz: "—"}
  note: "ظاهر النظم الخلف للسوسي (والْخُلْفُ يَاسِرٌ) والتقليل لنافع بروايتيه، والمعمول به الفتح للسوسي وقالون: الوافي ص285: إمالة السوسي هنا «خروج عن طريقه فلا يقرأ له إلا بالفتح»، وتقليل قالون في «ها يا» مريم ليس من طرق الناظم، فالتقليل لورش وحده."
  marji:
    - {kitab: "الوافي", safha: "285", mawdu: "ظاهر النظم الخلف للسوسي (والْخُلْفُ يَاسِرٌ) والتقليل لنافع بروايتيه، والمعمول به الفتح للسوسي وقالون: الوافي ص285: إمالة السوسي هنا «خروج عن طريقه فلا يقرأ …"}

