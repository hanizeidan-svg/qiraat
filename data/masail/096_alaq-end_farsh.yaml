# فرش الحروف: ومن سورة العلق إلى آخر القرآن — الأبيات 1115–1120
# الحقول والمنهج: انظر docs/METHOD.md والنموذجين 002_baqara_farsh_*.yaml
# تُركت ياء الإضافة «وَلِيَ دِينِ» (الكافرون 6) لمرحلة الأصول.

- id: 96-1115
  bayt: [1115]
  qawl: "وَعَنْ قُنْبُلٍ قَصْرًا رَوَى ابْنُ مُجاَهِدِ رَآهُ وَلَمْ يَأْخُذْ بِهِ مُتَعَمِّلاَ"
  rumuz: "«قنبل» و«ابن مجاهد» تصريح"
  word: أَنْ رَآهُ اسْتَغْنَى
  scope: موضع واحد
  loc: {at: [[96, 7, "رآه"]]}
  readings:
    - {by: "قنبل", lafz: "رَأَهُ", wasf: "بالقصر (حذف الألف بعد الهمزة)",
       dalil: "وَعَنْ قُنْبُلٍ قَصْرًا رَوَى ابْنُ مُجاَهِدِ رَآهُ", ramz: "«قنبل» تصريح"}
    - {by: "قنبل", lafz: "رَآهُ", wasf: "بالمد (همزة مفتوحة بعدها ألف)",
       dalil: "وَلَمْ يَأْخُذْ بِهِ مُتَعَمِّلاَ", ramz: "«قنبل» تصريح"}
    - {by: "الباقون", lafz: "رَآهُ", wasf: "بالمد (همزة مفتوحة بعدها ألف)",
       dalil: "مفهوم: القصر لمن ذُكر", ramz: "—"}
  note: "روى ابن مجاهد عن قنبل القصر «رَأَهُ» ولم يأخذ به. وأما الإمالة في الراء والهمزة فعلى أصولهم في «رأى» (مسألة 21-647a). الوافي ص 380: صحت رواية القصر عن قنبل، ولم يذكر الداني في التيسير له سواه، و«الأئمة أخذوا لقنبل بالوجهين» من طريق الناظم وأصله؛ فأُضيف له وجه القصر، وقُدِّم على ترتيب الوافي (القصر ثم المد لغيره)."
  marji:
    - {kitab: "الوافي", safha: "380", mawdu: "الوافي ص 380: صحت رواية القصر عن قنبل، ولم يذكر الداني في التيسير له سواه، و«الأئمة أخذوا لقنبل بالوجهين» من طريق الناظم وأصله"}

