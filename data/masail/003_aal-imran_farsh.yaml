- id: 3-559a
  bayt: [559, 560, 561, 562]
  qawl: "وَلاَ أَلِفٌ فِي هَا هَأَنْتُمْ زَكاَ جَنًا وَسَهِّلْ أَخاَ حَمْدٍ وَكَمْ مُبْدِلٍ جَلاَ"
  rumuz: "ز (زكا) = قنبل، ج (جنا) = ورش؛ أ (أخا) = نافع، ح (حمد) = أبو عمرو؛ ج (جلا) = ورش"
  word: هَا أَنْتُمْ
  scope: حيث وقع (آل عمران 66 و119، النساء 109، محمد 38)
  loc: {at: [[3, 66, "ها"], [3, 119, "ها"], [4, 109, "ها"], [47, 38, "ها"]], span: 2}
  readings:
    - {by: "قالون، أبو عمرو", lafz: "هَاأَنْتُمْ", wasf: "بالألف وتسهيل الهمزة بين بين",
       dalil: "وَسَهِّلْ أَخاَ حَمْدٍ", ramz: "أ (أخا) = نافع، ح (حمد) = أبو عمرو"}
    - {by: "ورش", lafz: "هَأَنْتُمْ", wasf: "بحذف الألف وتسهيل الهمزة بين بين",
       dalil: "وَلاَ أَلِفٌ فِي هَا هَأَنْتُمْ زَكاَ جَنًا وَسَهِّلْ أَخاَ حَمْدٍ", ramz: "ج (جنا) = ورش، أ (أخا) = نافع"}
    - {by: "ورش", lafz: "هَانْتُمْ", wasf: "بإبدال الهمزة ألفًا مع المد المشبع",
       dalil: "وَكَمْ مُبْدِلٍ جَلاَ", ramz: "ج (جلا) = ورش"}
    - {by: "قنبل", lafz: "هَأَنْتُمْ", wasf: "بحذف الألف وتحقيق الهمزة",
       dalil: "وَلاَ أَلِفٌ فِي هَا هَأَنْتُمْ زَكاَ", ramz: "ز (زكا) = قنبل"}
    - {by: "الباقون", lafz: "هَا أَنْتُمْ", wasf: "بالألف وتحقيق الهمزة، كلٌّ على مذهبه في المد المنفصل",
       dalil: "مفهوم: حذف الألف والتسهيل لمن ذُكر", ramz: "—"}
  note: "الهاء للتنبيه عند الكوفيين والبزي وابن ذكوان، ومبدلة من همزة عند قنبل وورش، وتحتمل الوجهين عند قالون وأبي عمرو وهشام (560–561؛ الوافي ص236 على ما اعتمده ابن الجزري). وعلى التنبيه يمد كلٌّ حسب مذهبه في المنفصل (562 أ، الوافي ص236)، فالبزي بالقصر. و«ذو البدل» في 562 ب هو ورش: له المد المشبع على الإبدال والقصر على التسهيل (الوافي ص237). وجها ورش على ترتيب الوافي (ص235): التسهيل بين بين، ثم الإبدال ألفًا مع الإشباع."
  review: "مقدار مد الألف لقالون وأبي عمرو على احتمال أن الهاء مبدلة من همزة (ألف الفصل قبل المسهَّلة): هل هو كمذهبهما في المنفصل أيضًا؟ (الوافي ص236 لا يحسم: نصّ على المد حسب المنفصل على وجه التنبيه فقط)."

