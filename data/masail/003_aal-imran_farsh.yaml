    - {by: "ورش، حمزة", wasf: "بالتقليل (بين اللفظين)",
       dalil: "وَقُلِّلَ فِي جَوْدٍ", ramz: "ف (في) = حمزة، ج (جود) = ورش"}
    - {by: "قالون", wasf: "بالفتح", dalil: "وَبِالْخُلْفِ بَلَّلاَ", ramz: "ب (بللا) = قالون"}
    - {by: "قالون", wasf: "بالتقليل", dalil: "وَبِالْخُلْفِ بَلَّلاَ", ramz: "ب (بللا) = قالون"}
    - {by: "الباقون", wasf: "بالفتح", dalil: "مفهوم: الإمالة والتقليل لمن ذُكر", ramz: "—"}
  note: "على ترتيب الوافي (ص230): روي عن قالون «وجهان: الفتح، والتقليل»."

