- id: 3-546a
  bayt: [546]
  qawl: "وَإِضْجَاعُكَ التَّوْرَاةَ مَا رُدَّ حُسْنُهُ وَقُلِّلَ فِي جَوْدٍ وَبِالْخُلْفِ بَلَّلاَ"
  rumuz: "م (ما) = ابن ذكوان، ر (رد) = الكسائي، ح (حسنه) = أبو عمرو؛ ف (في) = حمزة، ج (جود) = ورش؛ ب (بللا) = قالون بالخلف"
  word: التَّوْرَاةَ
  scope: حيث وقع
  loc: {search: "^(و|ب)?التوراة$"}
