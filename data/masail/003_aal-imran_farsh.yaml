# فرش سورة آل عمران — الأبيات 546–585 (الحقول كما في 002_baqara_farsh_445-474.yaml)
# بيت ياءات الإضافة (586) متروك لمرحلة الأصول.
# ما نصّ عليه الشاطبي هنا وحكمه في سور أخرى (الميت، زكريا، يبشر، كأين، الرعب، متم، قتلوا، يحزن، يميز…)
