- id: u22-m001
  bayt: [311, 314, 335]
  qawl: "وَقَبْلَ سُكُونٍ قِفْ بِمَا فِي أُصُولِهِمْ وَذُو الرَّاءِ فِيهِ الخُلْفُ في الْوَصْلِ يُجتَلاَ"
