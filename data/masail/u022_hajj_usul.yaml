  scope: الربع 133
  loc: {at: [[22, 2, "وترى"], [22, 5, "وترى"]]}
  readings:
    - {by: "السوسي", hal: "وصلًا", wasf: "بإمالة الراء"}
    - {by: "السوسي", hal: "وصلًا", wasf: "بالفتح"}
    - {by: "الباقون", hal: "وصلًا", wasf: "بالفتح (تُحذف الألف لالتقاء الساكنين)"}
    - {by: "أبو عمرو، حمزة، الكسائي", hal: "وقفًا", wasf: "بالإمالة الكبرى"}
    - {by: "ورش", hal: "وقفًا", wasf: "بالتقليل"}
    - {by: "الباقون", hal: "وقفًا", wasf: "بالفتح"}
  note: "قبل ساكن: في الوصل الخلف للسوسي وحده. وسقط ذكر ورش هنا في البدور (ص214)، وتقليله وقفًا ثابت كما في نظيره بالكهف (ص191، 193)."
  marji:
    - {kitab: "البدور الزاهرة", safha: "214", mawdu: "ممال الربع 133"}

