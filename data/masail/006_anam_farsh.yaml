  note: "المواضع: الأنعام 77، 78، النحل 85، 86، الكهف 53، الأحزاب 22. ظاهر النظم خلفٌ لشعبة والسوسي في إمالة الهمزة وصلًا («يقي صلا»)، وللسوسي في إمالة الراء وصلًا («يد بخلف»). والمعمول به (الوافي ص261، نقلًا عن المحققين): السوسي «ليس له إمالة في هذا القسم» لا في الراء ولا في الهمزة، وشعبة يميل الراء فقط كحمزة؛ فلا يميل أحد الهمزة وصلًا. ووقفًا كالأولى: والسوسي مع أبي عمرو بإمالة الهمزة وحدها (الوافي ص261 وص260). و«رَأَتْ، رَأَوْا، رَأَيْتَ» بالفتح للجميع."
