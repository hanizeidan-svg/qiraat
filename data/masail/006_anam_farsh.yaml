- id: 6-638a
  bayt: [638]
  qawl: "أَرَيْتَ فِي الاِسْتِفْهَامِ لاَ عَيْنَ رَاجِعٌ وَعَنْ نَافِعٍ سَهِّلْ وَكَمْ مُبْدِلٍ جَلاَ"
  rumuz: "ر (راجع) = الكسائي؛ «نافع» تصريح؛ ج (جلا) = ورش"
  word: أَرَأَيْتَ، أَرَأَيْتُمْ، أَرَأَيْتَكُمْ، أَفَرَأَيْتَ، أَفَرَأَيْتُمْ
  scope: حيث وقع (رأيت المسبوق بهمزة الاستفهام)
  loc: {search: "^أف?رأيت(ك|كم|م)?$"}
  readings:
