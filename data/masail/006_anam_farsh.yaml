    - {by: "الباقون", wasf: "بفتح الراء والهمزة", dalil: "مفهوم: الإمالة والتقليل لمن ذُكر", ramz: "—"}
  note: "المواضع: الأنعام 76، هود 70، يوسف 24، 28، طه 10، النجم 11، 18. ظاهر النظم الخلف للسوسي في إمالة الراء («وفي الراء يجتلا بخلف»)، والمعمول به فتحها مع إمالة الهمزة كالدوري: الوافي ص260: إمالة الراء له «لم تصح من طريق الناظم وأصله»."
