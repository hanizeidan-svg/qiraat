- id: 6-646a
  bayt: [646, 647]
  qawl: "وَحَرْفَيْ رَأَى كُلاًّ أَمِلْ مُزْنَ صُحْبَةٍ وَفِي هَمْزِهِ حُسْنٌ وَفِي الرَّاءِ يُجْتَلاَ بِخُلْفٍ ... وَعَنْ عُثْمَانَ في الْكُلِّ قُلِّلاَ"
  rumuz: "م (مزن) = ابن ذكوان، صحبة = حمزة والكسائي وشعبة؛ ح (حسن) = أبو عمرو؛ ي (يجتلا) = السوسي؛ «عثمان» = ورش"
