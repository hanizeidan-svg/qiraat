       dalil: "أَرَيْتَ فِي الاِسْتِفْهَامِ لاَ عَيْنَ رَاجِعٌ", ramz: "ر (راجع) = الكسائي"}
    - {by: "نافع", wasf: "بتسهيل الهمزة الثانية بين بين",
       dalil: "وَعَنْ نَافِعٍ سَهِّلْ", ramz: "«نافع» تصريح"}
    - {by: "ورش", tahwil: [["رَأَ", "رَا"]], wasf: "بإبدال الهمزة الثانية ألفًا مع المد المشبع للساكن",
       dalil: "وَكَمْ مُبْدِلٍ جَلاَ", ramz: "ج (جلا) = ورش"}
    - {by: "الباقون", wasf: "بتحقيق الهمزة", dalil: "مفهوم: الحذف والتسهيل لمن ذُكر", ramz: "—"}
  note: "لورش وجهان: التسهيل ثم الإبدال، ولقالون التسهيل وحده. يخرج «رَأَيْتَ» بلا همزة استفهام. ولحمزة في الوقف التسهيل على أصله في باب وقفه. على ترتيب الوافي (ص257): لورش وجهان «الأول كقالون»، والثاني الإبدال مع الإشباع."
  marji:
    - {kitab: "الوافي", safha: "257", mawdu: "على ترتيب الوافي (ص257): لورش وجهان «الأول كقالون»، والثاني الإبدال مع الإشباع"}

