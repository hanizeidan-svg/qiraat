# أصول الفاتحة والبقرة من «البدور الزاهرة» (ص15–57): الإمالة، والإدغام الكبير، والإدغام الصغير
#   ممال كل ربع ومدغمه كما سردها البدور، مقصورة على الرواة الأربعة عشر.
#   - ما في 002_baqara_usul.yaml لا يُكرَّر: هاء «فيه»، وإمالة الآيات 1–20 ومدغمها الكبير، والإدغام الصغير
#     (إذ، قد، تاء التأنيث، بل، يفعل ذلك، اتخذتم، لبثت)، وياءات الإضافة والزوائد في البقرة.
#   - الربع 20 (البقرة 283 – آل عمران 14) يسرده البدور في ص60 مع آل عمران، فلم يُدرج هنا.
#   - الصيغة المختصرة (imala / kabir / saghir) مشروحة في docs/USUL_METHOD.md.

- id: u1-k001
  bayt: [116, 118, 119]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ ... وَمَا كَانَ مِنْ مِثْلَيْنِ في كِلْمَتَيْهِمَا فَلاَبُدَّ مِنْ إدْغَامِ مَا كانَ أَوَّلاَ"
  word: "الرَّحِيمِ ۝ مَالِكِ (مَلِكِ عند السوسي)"
  scope: "الربع 1 (الفاتحة 1 – البقرة 25)"
  loc: {at: [[1, 3, "الرحيم"]]}
  kabir: true
  note: "الميم في الميم بين آخر الآية 3 وأول الآية 4، وذلك عند وصل الآيتين. والسوسي يقرأ «مَلِكِ» بلا ألف (فرش الفاتحة)."
  marji:
    - {kitab: "البدور الزاهرة", safha: "26", mawdu: "مدغم الربع 1 (الكبير)"}

