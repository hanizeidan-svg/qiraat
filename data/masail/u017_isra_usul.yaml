# ───────────── الإدغام الكبير ─────────────
- id: u17-k001
  bayt: [116, 118, 119, 129, 139, 140, 144]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ"
  word: "إِنَّهُ هُوَ، وَجَعَلْنَاهُ هُدًى، كِتَابَكَ كَفَى، نُهْلِكَ قَرْيَةً، نُرِيدُ ثُمَّ، فَأُولَئِكَ كَانَ، كَيْفَ فَضَّلْنَا"
  scope: "الربع 113 (الإسراء 1–22)"
  loc: {at: [[17, 1, "إنه"], [17, 2, "وجعلناه"], [17, 14, "كتابك"], [17, 16, "نهلك"], [17, 18, "نريد"], [17, 19, "فأولئك"], [17, 21, "كيف"]], span: 2}
  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار (انظر 2-k01)."
  marji:
    - {kitab: "البدور الزاهرة", safha: "184–185", mawdu: "المدغم الكبير في الربع (الإسراء 1–22)"}

- id: u17-k002
  bayt: [116, 118, 119, 142]
  qawl: "وَدُونَكَ الاِدْغَامَ الْكَبِيرَ وَقُطْبُهُ أَبُو عَمْروٍ الْبَصْرِيُّ فِيهِ تَحَفَّلاَ"
  word: "نَحْنُ نَرْزُقُهُمْ، أُولَئِكَ كَانَ، ذَلِكَ كَانَ، جَهَنَّمَ مَلُومًا، الْعَرْشِ سَبِيلًا"
  scope: "الربع 114 (الإسراء 23–49)"
  loc: {at: [[17, 31, "نحن"], [17, 36, "أولئك"], [17, 38, "ذلك"], [17, 39, "جهنم"], [17, 42, "العرش"]], span: 2}
  kabir: true
  note: "المعمول به: الإدغام الكبير للسوسي وحده، والدوري بالإظهار (انظر 2-k01). ولا يُدغم شين في سين إلا في «الْعَرْشِ سَبِيلًا»؛ وذكر البدور أن المقروء به من طريق الحرز فيه الإدغام وحده، والإظهار من طريق النشر. ولا إدغام في «لِلشَّيْطَانِ لِرَبِّهِ» (27) لسكون ما قبل النون."
  marji:
    - {kitab: "البدور الزاهرة", safha: "186", mawdu: "المدغم الكبير في الربع (الإسراء 23–49)"}

