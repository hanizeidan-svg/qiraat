- id: 29-953a
  bayt: [953]
  qawl: "مَوَدَّةً المَرْفُوعُ حَقُّ رُوَاتِهِ وَنَوِّنْهُ وَانْصِبْ بَيْنَكُمْ عَمَّ صَنْدَلاَ"
  rumuz: "حق = ابن كثير وأبو عمرو، ر (رواته) = الكسائي (للرفع)؛ عم = نافع وابن عامر، ص (صندلا) = شعبة (للتنوين والنصب)"
  word: مَوَدَّةَ بَيْنِكُمْ
  scope: موضع واحد
  loc: {at: [[29, 25, "مودة"]], span: 2}
  readings:
    - {by: "ابن كثير، أبو عمرو، الكسائي", lafz: "مَوَدَّةُ بَيْنِكُمْ", wasf: "برفع «مودة» بلا تنوين وجر «بينكم» بالإضافة",
       dalil: "مَوَدَّةً المَرْفُوعُ حَقُّ رُوَاتِهِ", ramz: "حق = ابن كثير وأبو عمرو، ر (رواته) = الكسائي"}
    - {by: "نافع، ابن عامر، شعبة", lafz: "مَوَدَّةً بَيْنَكُمْ", wasf: "بنصب «مودة» منونة ونصب «بينكم» ظرفًا",
       dalil: "وَنَوِّنْهُ وَانْصِبْ بَيْنَكُمْ عَمَّ صَنْدَلاَ", ramz: "عم = نافع وابن عامر، ص (صندلا) = شعبة"}
    - {by: "الباقون", lafz: "مَوَدَّةَ بَيْنِكُمْ", wasf: "بنصب «مودة» بلا تنوين وجر «بينكم» بالإضافة", dalil: "مفهوم: الرفع والتنوين لمن ذُكر", ramz: "—"}

