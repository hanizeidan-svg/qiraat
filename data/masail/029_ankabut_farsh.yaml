  qawl: "وَحَرِّكْ وَمُدَّ فِي النْنَشَاءةِ حَقًّا وَهْوَ حَيْثُ تَنَزَّلاَ"
  rumuz: "حق = ابن كثير وأبو عمرو"
  word: النَّشْأَةَ
  scope: حيث وقع (العنكبوت 20، النجم 47، الواقعة 62)
  loc: {search: "^النشأة$"}
  readings:
    - {by: "ابن كثير، أبو عمرو", tahwil: [["نَّشْأَةَ", "نَّشَاءَةَ"]], wasf: "بفتح الشين وألف بعدها (مد متصل)"}
    - {by: "الباقون", wasf: "بإسكان الشين بلا ألف", dalil: "مفهوم: التحريك والمد لمن ذُكر", ramz: "—"}
