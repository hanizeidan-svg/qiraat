# ملحوظة: عجز البيت 848 في shatibiyya.json مكرر من صدره؛ والصواب (ويكي مصدر): «وَفَوْقُ وَتَحْتَ الْمُلْكِ كَافِيهِ ظُلِّلاَ».

- id: 18-830a
  bayt: [830, 831]
  qawl: "وَسَكْتَةُ حَفْصٍ دُونَ قَطْعٍ لَطِيفَةٌ عَلَى أَلِفِ التَّنْوِينِ فِي عِوَجًا بَلاَ وَفِي نُونِ مَنْ رَاقٍ وَمَرْقَدِناَ وَلاَمِ بَلْ رَانَ وَالْبَاقُونَ لاَ سَكْتَ مُوصَلاَ"
  rumuz: "«حفص» تصريح، و«الباقون» تصريح"
  word: عِوَجًا ۝ قَيِّمًا / مِنْ مَرْقَدِنَا ۜ هَذَا / مَنْ ۜ رَاقٍ / بَلْ ۜ رَانَ
  scope: مواضع معينة (الكهف 1، يس 52، القيامة 27، المطففين 14)
  loc: {at: [[18, 1, "عوجا"], [36, 52, "مرقدنا"], [75, 27, "من"], [83, 14, "بل"]]}
  readings:
    - {by: "حفص", wasf: "بسكتة لطيفة من غير تنفس وصلًا (على ألف «عوجا» المبدلة من التنوين، وألف «مرقدنا»، ونون «من»، ولام «بل»)"}
    - {by: "الباقون", wasf: "بالوصل بلا سكت (مع إخفاء التنوين في «عوجا قيما»، وإدغام النون واللام في الراء في «من راق» و«بل ران»)",
       dalil: "وَالْبَاقُونَ لاَ سَكْتَ مُوصَلاَ", ramz: "«الباقون» تصريح"}
  note: "السكت في الوصل خاصة؛ والوقف على «عوجا» و«مرقدنا» تام للجميع بلا فرق. وبالسكت يمتنع الإدغام لحفص في «من راق» و«بل ران»."

- id: 18-832a
  bayt: [832, 833]
  qawl: "وَمِنْ لَدْنِهِ في الضَّمِّ أَسْكِنْ مُشِمَّهُ وَمِنْ بَعْدِهِ كَسْرَانِ عَنْ شُعْبَةَ اعْتَلاَ وَضُمَّ وَسَكِّنْ ثُمَّ ضُمَّ لِغَيْرِهِ وَكُلُّهُمُ فِي الْهَا عَلَى أَصْلِهِ تَلاَ"
  rumuz: "«شعبة» تصريح، و«لغيره» = الباقون"
  word: مِنْ لَدُنْهُ (الكهف 2)
  scope: موضع واحد
  loc: {at: [[18, 2, "لدنه"]]}
  readings:
    - {by: "شعبة", lafz: "لَدْنِهِ", wasf: "بإسكان الدال مع إشمامها الضم، وكسر النون والهاء، مع صلة الهاء بياء وصلًا (لَدْنِهِي)",
       dalil: "وَمِنْ لَدْنِهِ في الضَّمِّ أَسْكِنْ مُشِمَّهُ وَمِنْ بَعْدِهِ كَسْرَانِ عَنْ شُعْبَةَ اعْتَلاَ"}
    - {by: "ابن كثير", wasf: "بضم الدال وإسكان النون وضم الهاء، مع صلتها بواو وصلًا على أصله (لَدُنْهُو)",
       dalil: "وَضُمَّ وَسَكِّنْ ثُمَّ ضُمَّ لِغَيْرِهِ وَكُلُّهُمُ فِي الْهَا عَلَى أَصْلِهِ تَلاَ", ramz: "«لغيره»، و«على أصله» = صلة ابن كثير"}
    - {by: "الباقون", wasf: "بضم الدال وإسكان النون وضم الهاء بلا صلة", dalil: "وَضُمَّ وَسَكِّنْ ثُمَّ ضُمَّ لِغَيْرِهِ", ramz: "«لغيره» تصريح"}
  note: "خاص بموضع الكهف؛ و«مِنْ لَدُنْهُ أَجْرًا» (النساء 40) بالضم والإسكان للجميع."

